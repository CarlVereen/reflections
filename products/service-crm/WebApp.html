<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root{
    --accent:#8f5f22; --accent-lite:#b8823a; --dark:#1a1c1f; --ink:#1a1c1f; --soft:#f3f0ea;
    --line:#e4dccd; --muted:#6b6459; --good:#3f7d55; --warn:#c0492b; --bg:#faf8f4; --card:#fff;
    --blue:#2a4d80; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Segoe UI',Roboto,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
  .app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:76px}
  /* top bar */
  .topbar{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--accent),#6e4a1a);color:#fff;
    padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
  .topbar h1{font-size:17px;font-weight:800;letter-spacing:-.2px}
  .topbar .sub{font-size:11.5px;opacity:.85}
  .iconbtn{background:rgba(255,255,255,.18);border:0;color:#fff;width:36px;height:36px;border-radius:10px;font-size:16px;cursor:pointer}
  /* screens */
  .screen{display:none;padding:14px}
  .screen.on{display:block;animation:fade .2s ease}
  @keyframes fade{from{opacity:.3}to{opacity:1}}
  h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;margin:18px 4px 10px}
  /* metric tiles */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .tile .l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .tile .v{font-size:26px;font-weight:800;color:var(--ink);margin-top:4px;letter-spacing:-.5px}
  .tile.good .v{color:var(--good)}
  .tile .hint{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.2}
  /* cards & lists */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .list-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
  .list-item:active{border-color:var(--accent-lite)}
  .list-item .name{font-weight:700}
  .list-item .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
  .pill{font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .p-new{background:#e8eef7;color:#2a4d80}.p-contacted{background:#fff3d6;color:#8a6d1a}.p-quoted{background:#ffe4c4;color:#8f5f22}
  .p-won,.p-accepted,.p-paid,.p-done{background:#d8efdf;color:#2c6b42}.p-lost,.p-declined,.p-overdue,.p-cancelled{background:#f5d9d3;color:#a33}
  .p-draft{background:#eeeeee;color:#555}.p-sent{background:#fff3d6;color:#8a6d1a}.p-scheduled{background:#e8eef7;color:#2a4d80}.p-inprogress{background:#fff3d6;color:#8a6d1a}
  .muted{color:var(--muted);font-size:13px}
  .empty{color:var(--muted);text-align:center;padding:26px 10px;font-style:italic}
  /* buttons */
  .btn{display:block;width:100%;border:0;border-radius:999px;padding:13px;font-weight:800;font-size:15px;cursor:pointer;
    background:linear-gradient(180deg,var(--accent),#6e4a1a);color:#fff;margin-top:10px;text-align:center;text-decoration:none}
  .btn:active{filter:brightness(1.1)}
  .btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);}
  .btn.sm{width:auto;display:inline-block;padding:9px 16px;font-size:13px;margin:0}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .btnrow .btn{flex:1;margin-top:0}
  /* forms */
  label{display:block;font-weight:700;font-size:12.5px;margin:12px 0 4px;color:var(--ink)}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(143,95,34,.25)}
  .two{display:flex;gap:8px}.two>div{flex:1}
  /* FAB */
  .fab{position:fixed;right:calc(50% - 320px + 16px);bottom:88px;z-index:25;width:56px;height:56px;border-radius:50%;
    background:linear-gradient(180deg,var(--accent),#6e4a1a);color:#fff;border:0;font-size:26px;box-shadow:0 6px 18px rgba(143,95,34,.45);cursor:pointer}
  @media(max-width:672px){.fab{right:16px}}
  /* bottom nav */
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);
    display:flex;max-width:640px;margin:0 auto}
  .nav button{flex:1;background:none;border:0;padding:9px 0 8px;font-size:10.5px;color:var(--muted);cursor:pointer;font-weight:700}
  .nav button .i{display:block;font-size:19px;margin-bottom:1px}
  .nav button.on{color:var(--accent)}
  /* line item builder */
  .lirow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
  .lirow select{flex:2}.lirow input{flex:1;min-width:0}
  .lirow .x{flex:0 0 auto;width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--warn);font-size:16px;cursor:pointer}
  .totalbar{display:flex;justify-content:space-between;font-weight:800;font-size:17px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
  .totalbar .tax{font-weight:600;font-size:13px;color:var(--muted)}
  /* modal */
  .overlay{position:fixed;inset:0;z-index:40;background:rgba(20,22,25,.5);display:none;align-items:flex-end;justify-content:center}
  .overlay.on{display:flex}
  .sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 26px}
  .sheet h3{font-size:18px;font-weight:800;margin-bottom:4px}
  .sheet .close{float:right;background:none;border:0;font-size:22px;color:var(--muted);cursor:pointer}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:60;background:var(--dark);color:#fff;
    padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
  .toast.on{opacity:1}
  .spin{text-align:center;padding:40px;color:var(--muted)}
  /* collapsible date groups (Leads) */
  .grp{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;
    margin:14px 2px 8px;padding:4px 2px;font-weight:800;font-size:13px;letter-spacing:.02em}
  .grp .car{width:14px;color:var(--muted);font-size:12px}
  .grp .gt{text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .grp .gt.od{color:var(--warn)}
  .grp .gd{font-weight:600;color:var(--muted);font-size:12px}
  .grp .gc{margin-left:auto;background:var(--soft);color:var(--muted);border-radius:999px;
    min-width:22px;text-align:center;padding:1px 8px;font-size:11.5px;font-weight:800}
  .grp.odh .gc{background:#f5d9d3;color:#a33}
  /* segmented sort control */
  .seg{display:flex;gap:6px;margin-top:8px}
  .segbtn{flex:1;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 0;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
  .segbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div><h1 id="bizName">Service Pro CRM</h1><div class="sub" id="screenName">Home</div></div>
    <button class="iconbtn" onclick="refreshAll()" title="Refresh">⟳</button>
  </div>

  <!-- HOME -->
  <div class="screen on" id="s-home">
    <div id="homeBody"><div class="spin">Loading…</div></div>
  </div>

  <!-- CONTACTS (leads + clients) -->
  <div class="screen" id="s-contacts">
    <input id="contactSearch" placeholder="Search contacts…" oninput="renderContacts()">
    <div class="seg">
      <button class="segbtn on" data-sort="name" onclick="setContactSort('name')">Name</button>
      <button class="segbtn" data-sort="job" onclick="setContactSort('job')">Last job</button>
    </div>
    <div id="contactsBody" style="margin-top:10px"></div>
  </div>

  <!-- BILLING (quotes + invoices in one place) -->
  <div class="screen" id="s-billing">
    <button class="btn" onclick="openQuoteBuilder()">+ New estimate</button>
    <div id="billingBody" style="margin-top:12px"></div>
  </div>

  <!-- MORE -->
  <div class="screen" id="s-more">
    <h2 class="sec">More</h2>
    <div class="list-item" onclick="nav('settings')"><div class="row"><div><div class="name">⚙️ Settings</div><div class="meta">Business info, services, tax, links</div></div><span>›</span></div></div>
  </div>

  <!-- JOBS -->
  <div class="screen" id="s-jobs">
    <button class="btn" onclick="openJobForm()">+ New job</button>
    <div id="jobsBody" style="margin-top:12px"></div>
  </div>

  <!-- SETTINGS -->
  <div class="screen" id="s-settings">
    <div id="settingsBody"></div>
  </div>
</div>

<button class="fab" id="fab" onclick="fabAction()">+</button>

<div class="nav">
  <button class="on" data-s="home" onclick="nav('home')"><span class="i">🏠</span>Home</button>
  <button data-s="contacts" onclick="nav('contacts')"><span class="i">👥</span>Contacts</button>
  <button data-s="jobs" onclick="nav('jobs')"><span class="i">🗓️</span>Jobs</button>
  <button data-s="billing" onclick="nav('billing')"><span class="i">💵</span>Billing</button>
  <button data-s="more" onclick="nav('more')"><span class="i">⋯</span>More</button>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- state + api ---------------- */
var S={settings:{},services:[],dashboard:null,contacts:[],jobs:[],quotes:[],invoices:[],statuses:{}};
var CUR='$';
function api(fn){
  var args=[].slice.call(arguments,1);
  return new Promise(function(res,rej){
    if(typeof google==='undefined'||!google.script||!google.script.run){ return res(mock(fn,args)); }
    var r=google.script.run.withSuccessHandler(res).withFailureHandler(function(e){rej(e);});
    r[fn].apply(r,args);
  });
}
function money(n){ n=Number(n)||0; return CUR+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function money0(n){ n=Number(n)||0; return CUR+Math.round(n).toLocaleString(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function pill(status){ var k=String(status||'').toLowerCase().replace(/[^a-z]/g,''); return '<span class="pill p-'+k+'">'+esc(status||'')+'</span>'; }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('on');},2600); }
function busy(msg){ toast(msg||'Working…'); }

/* ---------------- nav ---------------- */
var CUR_SCREEN='home';
var TITLES={home:'Home',contacts:'Contacts',billing:'Billing',more:'More',jobs:'Jobs',settings:'Settings'};
function nav(s){
  if(s==='quotes'||s==='invoices') s='billing';      // old names → merged Billing screen
  if(s==='leads'||s==='clients') s='contacts';       // old names → merged Contacts screen
  CUR_SCREEN=s;
  document.querySelectorAll('.screen').forEach(function(el){el.classList.remove('on');});
  document.getElementById('s-'+s).classList.add('on');
  document.querySelectorAll('.nav button').forEach(function(b){ b.classList.toggle('on', b.dataset.s===s); });
  document.getElementById('screenName').textContent=TITLES[s]||'';
  var fab=document.getElementById('fab'); fab.style.display=(['contacts','billing','jobs'].indexOf(s)>-1)?'block':'none';
  window.scrollTo(0,0);
  if(s==='home')loadHome();
  if(s==='contacts')loadContacts();
  if(s==='billing')loadBilling();
  if(s==='jobs')loadJobs();
  if(s==='settings')renderSettings();
}
function fabAction(){ if(CUR_SCREEN==='contacts')openContactForm(); else if(CUR_SCREEN==='billing')openQuoteBuilder(); else if(CUR_SCREEN==='jobs')openJobForm(); }

/* ---------------- modal ---------------- */
function openModal(html){ document.getElementById('sheet').innerHTML=html; document.getElementById('overlay').classList.add('on'); }
function closeModal(){ document.getElementById('overlay').classList.remove('on'); }

/* ---------------- boot ---------------- */
function boot(){
  api('apiBootstrap').then(function(b){
    if(!b||!b.ready){ document.getElementById('homeBody').innerHTML='<div class="empty">Run <b>⚡ CRM ▸ Set up / rebuild CRM</b> in the sheet first, then reload.</div>'; return; }
    S.settings=b.settings||{}; S.services=b.services||[]; S.dashboard=b.dashboard;
    S.statuses={lead:b.leadStatuses,job:b.jobStatuses,inv:b.invStatuses,est:b.estStatuses,repeat:b.repeatOpts};
    CUR=(S.settings.currency||'$').trim()||'$';
    if(S.settings.businessName) document.getElementById('bizName').textContent=S.settings.businessName;
    renderHome();
  }).catch(function(e){ document.getElementById('homeBody').innerHTML='<div class="empty">Could not load: '+esc(e&&e.message||e)+'</div>'; });
}
function refreshAll(){ busy('Refreshing…'); S.dashboard=null; boot(); nav(CUR_SCREEN); }

/* ---------------- HOME ---------------- */
function loadHome(){ if(!S.dashboard){ api('apiDashboard').then(function(d){S.dashboard=d;renderHome();}); } else renderHome(); }
function renderHome(){
  var d=S.dashboard; if(!d){ return; }
  var h='';
  h+='<div class="tiles">'+
     tile('New leads · 7d',d.newLeads)+tile('Unpaid',money0(d.unpaid||0),'invoices sent, not paid')+
     tile('Jobs this week',d.jobsWeek)+tile('Revenue · mo',money0(d.revMonth))+'</div>';
  h+='<div class="tiles" style="margin-top:10px">'+tileGood('Win rate',d.winRate+'%','of leads marked Won vs Lost')+tileGood('Lifetime',money0(d.revLife))+'</div>';
  h+='<div class="btnrow"><button class="btn" onclick="openContactForm()">+ Contact</button><button class="btn" onclick="openQuoteBuilder()">+ Estimate</button></div>';
  h+='<h2 class="sec">🔔 Follow-ups due</h2>';
  if(d.followUps&&d.followUps.length){ d.followUps.forEach(function(f){
    h+='<div class="list-item"><div class="row"><div><div class="name">'+esc(f.name)+'</div><div class="meta">'+esc(f.phone||'—')+' · due '+esc(f.due)+'</div></div>'+pill(f.status)+'</div></div>';
  }); } else h+='<div class="empty">All caught up 🎉</div>';
  h+='<h2 class="sec">📅 This week\'s jobs</h2>';
  if(d.weekJobs&&d.weekJobs.length){ d.weekJobs.forEach(function(j){
    h+='<div class="list-item" onclick="openJobFromHome('+j.row+')"><div class="row"><div><div class="name">'+esc(j.client)+'</div><div class="meta">'+esc(j.date)+' · '+esc(j.service||'')+'</div></div>'+pill(j.status)+'</div></div>';
  }); } else h+='<div class="empty">No jobs scheduled this week</div>';
  document.getElementById('homeBody').innerHTML=h;
}
function tileHint(h){ return h?'<div class="hint">'+esc(h)+'</div>':''; }
function tile(l,v,h){ return '<div class="tile"><div class="l">'+l+'</div><div class="v">'+v+'</div>'+tileHint(h)+'</div>'; }
function tileGood(l,v,h){ return '<div class="tile good"><div class="l">'+l+'</div><div class="v">'+v+'</div>'+tileHint(h)+'</div>'; }
// Surface a server error instead of leaving a screen stuck on "Loading…".
function loadFail(el,e){ document.getElementById(el).innerHTML='<div class="empty">Couldn\'t load — '+esc(e&&e.message||e||'unknown error')+'.<br>Tap ⟳ to retry. If this persists after a code change, redeploy a new version (Deploy ▸ Manage deployments ▸ ✏️ ▸ New version).</div>'; }

/* ---------------- CONTACTS (leads + clients merged) ---------------- */
function loadContacts(){ document.getElementById('contactsBody').innerHTML='<div class="spin">Loading…</div>'; api('apiListContacts').then(function(l){S.contacts=l||[];S.contacts.forEach(function(c,i){c._i=i;});renderContacts();}).catch(function(e){loadFail('contactsBody',e);}); }
/* ---- date helpers (follow-up + job reschedule) ---- */
function midnight(d){ var x=new Date(d); x.setHours(0,0,0,0); return x; }
function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function nextMonday(t){ var diff=(8-t.getDay())%7; if(diff===0)diff=7; return addDays(t,diff); }
function isoOf(d){ var m=d.getMonth()+1,day=d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day; }
// Tag rule: once someone has a logged job, show their last job date (green). Otherwise
// show their lead status (New / Quoted / Declined / Lost).
function contactTag(c){
  if(c.lastJobISO) return {label:'Job '+esc(c.lastJobDate),cls:'p-paid'};
  var s=c.leadStatus||'';
  if(s==='Contacted') s='New';
  if(s==='Won') return {label:'Client',cls:'p-paid'};
  if(!s) return c.clientRow?{label:'Client',cls:'p-paid'}:{label:'New',cls:'p-new'};
  return {label:esc(s),cls:'p-'+s.toLowerCase().replace(/[^a-z]/g,'')};
}
function contactPill(c){ var t=contactTag(c); return '<span class="pill '+t.cls+'">'+t.label+'</span>'; }
function contactRow(c){
  return '<div class="list-item" onclick="openContact('+c._i+')"><div class="row"><div><div class="name">'+esc(c.name)+'</div>'+
     '<div class="meta">'+esc(c.phone||'—')+(c.email?' · '+esc(c.email):'')+'</div></div>'+contactPill(c)+'</div></div>';
}
var CONTACT_SORT='name';
function setContactSort(s){ CONTACT_SORT=s; document.querySelectorAll('#s-contacts .segbtn').forEach(function(b){b.classList.toggle('on',b.dataset.sort===s);}); renderContacts(); }
function renderContacts(){
  var q=(document.getElementById('contactSearch').value||'').toLowerCase();
  var list=(S.contacts||[]).filter(function(c){ return !q || (c.name+' '+c.phone+' '+c.email).toLowerCase().indexOf(q)>-1; });
  var body=document.getElementById('contactsBody');
  if(!list.length){ body.innerHTML='<div class="empty">'+(q?'No contacts match that search.':'No contacts yet. Tap + to add one.')+'</div>'; return; }
  if(CONTACT_SORT==='job') list.sort(function(a,b){ if(a.lastJobISO&&b.lastJobISO) return b.lastJobISO.localeCompare(a.lastJobISO); if(a.lastJobISO) return -1; if(b.lastJobISO) return 1; return a.name.localeCompare(b.name); });
  else list.sort(function(a,b){ return a.name.localeCompare(b.name); });
  body.innerHTML=list.map(contactRow).join('');
}
function openContactForm(){
  openModal('<button class="close" onclick="closeModal()">×</button><h3>New contact</h3>'+
    field('Name *','ld_name','','Jane Smith')+ '<div class="two"><div>'+field('Phone','ld_phone','','(555) 123-4567')+'</div><div>'+field('Est. value','ld_value','','250')+'</div></div>'+
    field('Email','ld_email','','jane@email.com')+ serviceSelect('ld_service')+
    '<button class="btn" onclick="saveLead()">Add contact</button>');
}
var PENDING_LEAD=null;
function saveLead(){
  var name=val('ld_name'); if(!name){toast('Name is required');return;}
  PENDING_LEAD={name:name,phone:val('ld_phone'),email:val('ld_email'),service:val('ld_service'),value:val('ld_value')};
  submitLead(false);
}
function submitLead(force){
  if(!PENDING_LEAD)return;
  busy('Adding…');
  var p=Object.assign({},PENDING_LEAD,{force:!!force});
  api('apiAddLead',p).then(function(r){
    if(r&&r.dup&&!force){ confirmDupLead(r); return; }
    PENDING_LEAD=null; closeModal(); toast('✅ Contact added'); S.dashboard=null; loadContacts();
  });
}
function confirmDupLead(r){
  var rows=(r.dupes||[]).slice(0,4).map(function(d){
    return '<div class="list-item"><div class="name">'+esc(d.name)+'</div><div class="meta">'+(d.where==='client'?'Client':'Lead')+
      (d.phone?' · '+esc(d.phone):'')+(d.email?' · '+esc(d.email):'')+'</div></div>';
  }).join('');
  openModal('<button class="close" onclick="closeModal()">×</button><h3>⚠️ Possible duplicate</h3>'+
    '<div class="muted" style="margin-bottom:8px">The same email or phone is already in your CRM:</div>'+rows+
    '<button class="btn" onclick="submitLead(true)">Add anyway</button>'+
    '<button class="btn sec" onclick="PENDING_LEAD=null;closeModal();">Cancel</button>');
}
function openContact(i){
  var c=S.contacts[i]; if(!c)return;
  var tel=c.phone?String(c.phone).replace(/[^0-9+]/g,''):'';
  var info='<div class="muted">'+esc(c.phone||'—')+(c.email?' · '+esc(c.email):'')+'</div>';
  if(c.address) info+='<div class="muted" style="margin-top:2px">'+esc(c.address)+'</div>';
  var meta=[];
  if(c.lastJobDate) meta.push('Last job '+esc(c.lastJobDate));
  if(c.jobCount) meta.push(c.jobCount+' job'+(c.jobCount>1?'s':''));
  if(c.totalSpent) meta.push(money0(c.totalSpent)+' spent');
  if(meta.length) info+='<div class="muted" style="margin-top:2px">'+meta.join(' · ')+'</div>';
  var h='<button class="close" onclick="closeModal()">×</button><h3>'+esc(c.name)+' '+contactPill(c)+'</h3>'+info+
    (tel?'<div class="btnrow"><a class="btn sec" href="tel:'+tel+'">Call</a><a class="btn sec" href="sms:'+tel+'">Text</a></div>':'')+
    '<div class="btnrow"><button class="btn" onclick="quoteFromContact('+i+')">Create estimate</button><button class="btn sec" onclick="openContactEdit('+i+')">Edit</button></div>';
  if(c.leadRow){
    var base=midnight(new Date());

var QLINES=[];
function openQuoteBuilder(lead){
  QLINES=[{service:'',qty:1,rate:''}];
  var pre=lead||{};
  openModal('<button class="close" onclick="closeModal()">×</button><h3>New estimate</h3>'+
    field('Client name *','q_client',pre.name||'','Jane Smith')+
    '<div class="two"><div>'+field('Email','q_email',pre.email||'','jane@email.com')+'</div><div>'+field('Phone','q_phone',pre.phone||'','(555) 123-4567')+'</div></div>'+
    '<label>Line items</label><div id="qlines"></div>'+
    '<button class="btn sec sm" style="margin-top:6px" onclick="addQLine()">+ Add line</button>'+
    '<div class="totalbar"><span>Total <span class="tax" id="q_taxnote"></span></span><span id="q_total">'+money(0)+'</span></div>'+
    '<button class="btn" onclick="createQuote(false)">Create estimate</button>'+
    '<button class="btn sec" onclick="createQuote(true)">Create & send</button>');
  renderQLines();
}
function renderQLines(){
  var opts=serviceOptions();
  var h=QLINES.map(function(l,i){
    return '<div class="lirow">'+
      '<select onchange="QLINES['+i+'].service=this.value">'+'<option value="">Service…</option>'+opts.map(function(s){return '<option'+(s===l.service?' selected':'')+'>'+esc(s)+'</option>';}).join('')+'</select>'+
      '<input type="number" inputmode="decimal" placeholder="Qty" value="'+(l.qty||'')+'" oninput="QLINES['+i+'].qty=this.value;calcQ()">'+
      '<input type="number" inputmode="decimal" placeholder="Price" value="'+(l.rate||'')+'" oninput="QLINES['+i+'].rate=this.value;calcQ()">'+
      '<button class="x" onclick="delQLine('+i+')">×</button></div>';
  }).join('');
  document.getElementById('qlines').innerHTML=h; calcQ();
}
function addQLine(){ QLINES.push({service:'',qty:1,rate:''}); renderQLines(); }
function delQLine(i){ QLINES.splice(i,1); if(!QLINES.length)QLINES.push({service:'',qty:1,rate:''}); renderQLines(); }
function calcQ(){
  var sub=0; QLINES.forEach(function(l){ sub+=(Number(l.qty)||0)*(Number(l.rate)||0); });
  var taxPct=Number(S.settings.taxPct)||0; var tax=sub*taxPct/100;
  document.getElementById('q_total').textContent=money(sub+tax);
  document.getElementById('q_taxnote').textContent=taxPct?('(incl '+taxPct+'% tax)'):'';
}
function createQuote(send){
  var client=val('q_client'); if(!client){toast('Client name required');return;}
  var lines=QLINES.filter(function(l){return l.service&&Number(l.rate)>0;});
  if(!lines.length){toast('Add a line item with a price');return;}
  busy('Creating…');
  api('apiCreateEstimate',{client:client,email:val('q_email'),phone:val('q_phone'),validDays:14,lines:lines})
   .then(function(r){
     if(!r||!r.ok){toast(r&&r.msg||'Failed');return;}
     if(send){ busy('Sending estimate…'); api('apiSendDoc','ESTIMATE',r.number).then(function(s){ closeModal(); toast(s&&s.emailed?'📧 Estimate #'+r.number+' sent':'Estimate #'+r.number+' created (no client email)'); S.dashboard=null; loadQuotes(); }); }
     else { closeModal(); toast('Estimate #'+r.number+' created'); loadQuotes(); }
   });
}

function loadQuotes(){ loadBilling(); }

function loadBilling(){
  document.getElementById('billingBody').innerHTML='<div class="spin">Loading…</div>';
  Promise.all([api('apiListDocs','ESTIMATE'),api('apiListDocs','INVOICE')]).then(function(r){
    S.quotes=r[0]||[]; S.invoices=r[1]||[]; renderBilling();

function docRow(kind,d){
  return '<div class="list-item" onclick="openDoc(\''+kind+'\','+JSON.stringify(d.number)+')"><div class="row"><div><div class="name">#'+esc(d.number)+' · '+esc(d.client)+'</div>'+
     '<div class="meta">'+money(d.amount)+' · '+esc(d.dateA||'draft')+'</div></div>'+pill(d.status)+'</div></div>';
}
var BILL_OPEN={quotes:true,outstanding:true,paid:false,closedq:false};
function toggleBill(k){ BILL_OPEN[k]=!BILL_OPEN[k]; renderBilling(); }
function renderBilling(){
  var body=document.getElementById('billingBody');
  var quotes=S.quotes||[], invs=S.invoices||[];
  if(!quotes.length && !invs.length){ body.innerHTML='<div class="empty">Nothing yet. Tap <b>+ New estimate</b> to send your first quote.</div>'; return; }
  var groups=[
    {k:'quotes',      label:'Quotes',              kind:'ESTIMATE', arr:quotes.filter(function(d){return ['Draft','Sent'].indexOf(d.status)>=0;}),      empty:'No open quotes',            always:true},
    {k:'outstanding', label:'Outstanding invoices',kind:'INVOICE',  arr:invs.filter(function(d){return d.status!=='Paid';}),                              empty:'Nothing awaiting payment 🎉', always:true},
    {k:'paid',        label:'Paid',                kind:'INVOICE',  arr:invs.filter(function(d){return d.status==='Paid';}),                              empty:'',                          always:false},
    {k:'closedq',     label:'Closed quotes',       kind:'ESTIMATE', arr:quotes.filter(function(d){return ['Accepted','Declined'].indexOf(d.status)>=0;}),empty:'',                          always:false}
  ];
  var h='';
  groups.forEach(function(g){
    if(!g.arr.length && !g.always) return;                 // hide empty Paid / Closed-quotes headers
    var open=!!BILL_OPEN[g.k];
    h+='<div class="grp" onclick="toggleBill(\''+g.k+'\')">'+
       '<span class="car">'+(open?'▾':'▸')+'</span>'+
       '<span class="gt">'+g.label+'</span>'+
       '<span class="gc">'+g.arr.length+'</span></div>';
    if(open) h+= g.arr.length ? g.arr.map(function(d){return docRow(g.kind,d);}).join('')
                              : '<div class="empty">'+g.empty+'</div>';
  });
  body.innerHTML=h;
}
function openDoc(kind,number){
  var list=kind==='INVOICE'?S.invoices:S.quotes;
  var d=list.filter(function(x){return String(x.number)===String(number);})[0]; if(!d)return;
  busy('Opening…');
  api('apiGetDocLines',number).then(function(lines){
    var items=(lines||[]).map(function(l){return '<div class="row" style="padding:4px 0"><span>'+esc(l.service)+' ×'+l.qty+'</span><span>'+money(l.qty*l.rate)+'</span></div>';}).join('')||'<div class="muted">No line items (uses amount '+money(d.amount)+')</div>';
    var btns='';
    if(kind==='ESTIMATE'){
      btns='<button class="btn" onclick="sendDoc(\'ESTIMATE\','+JSON.stringify(number)+')">Send estimate</button>'+
           '<button class="btn ghost" onclick="approve('+JSON.stringify(number)+')">Approve → create invoice</button>';
    } else {
      btns='<button class="btn" onclick="sendDoc(\'INVOICE\','+JSON.stringify(number)+')">Send invoice</button>'+
           (d.status!=='Paid'?'<button class="btn sec" onclick="markPaid('+JSON.stringify(number)+')">Mark paid</button>':'');
    }
    openModal('<button class="close" onclick="closeModal()">×</button><h3>'+(kind==='INVOICE'?'Invoice':'Estimate')+' #'+esc(number)+'</h3>'+
      '<div class="muted">'+esc(d.client)+' · '+esc(d.status)+'</div>'+
      '<div class="card" style="margin-top:12px">'+items+'<div class="totalbar"><span>Total</span><span>'+money(d.amount)+'</span></div></div>'+
      '<button class="btn sec" onclick="editLines(\''+kind+'\','+JSON.stringify(number)+')">Edit line items</button>'+btns);
  });
}

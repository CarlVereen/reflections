<style>
:root{
  --accent:#8f5f22; --accent-lite:#b8823a; --accent-dark:#6e4a1a; --accent-glow:rgba(143,95,34,.25);
  --ink:#1a1c1f; --soft:#f3f0ea; --line:#e4dccd; --muted:#6b6459; --good:#3f7d55; --warn:#c0492b;
  --bg:#faf8f4; --card:#fff; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Roboto,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
.app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:76px}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;
  padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.topbar h1{font-size:17px;font-weight:800}.topbar .sub{font-size:12px;opacity:.85}
.iconbtn{background:rgba(255,255,255,.18);border:0;color:#fff;width:36px;height:36px;border-radius:10px;font-size:16px;cursor:pointer}
.screen{display:none;padding:14px}.screen.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.tile .l{font-size:12px;color:var(--muted);font-weight:700}.tile .v{font-size:24px;font-weight:800;margin-top:4px;letter-spacing:-.5px}
.tile .hint{font-size:11px;color:var(--muted);margin-top:2px}.tile.good .v{color:var(--good)}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 2px 8px;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.list-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.list-item:active{border-color:var(--accent-lite)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.name{font-weight:700}.meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.pill{font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap}
.p-lead,.p-draft{background:#e8eef7;color:#2a4d80}.p-active,.p-accepted,.p-paid,.p-done{background:#d8efdf;color:#2c6b42}
.p-inactive{background:#eeeeee;color:#555}.p-lost,.p-declined,.p-overdue,.p-cancelled{background:#f5d9d3;color:#a33}
.p-sent,.p-scheduled{background:#fff3d6;color:#8a6d1a}.p-pastdue{background:#f5d9d3;color:#a33}
.muted{color:var(--muted);font-size:13px}.empty{color:var(--muted);text-align:center;padding:26px 10px;font-style:italic}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:13px;font-weight:800;font-size:15px;cursor:pointer;
  background:linear-gradient(180deg,var(--accent),var(--accent-dark));color:#fff;margin-top:10px;text-align:center}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.danger{background:#fff;color:var(--warn);border:1px solid #eab8ab}
.btn.sm{width:auto;display:inline-block;padding:9px 16px;font-size:13px;margin:0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btnrow .btn{flex:1;margin-top:0}
label{display:block;font-weight:700;font-size:12.5px;margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.two{display:flex;gap:8px}.two>div{flex:1;min-width:0}
.seg{display:flex;gap:6px;margin-top:8px}
.segbtn{flex:1;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 4px;font-weight:700;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.segbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.segbtn .tc{font-size:10.5px;font-weight:800;opacity:.8;margin-left:4px}
.liwrap{border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;background:var(--card)}
.liwrap .r2{display:flex;gap:6px;align-items:flex-end;margin-top:6px}.liwrap .r2 .fld{flex:1;min-width:0}
.liwrap .r2 .fld label{margin:0 0 3px}
.liwrap .x{flex:0 0 auto;width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--warn);cursor:pointer}
.totalbar{display:flex;justify-content:space-between;font-weight:800;font-size:17px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.subline{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:6px}
.actionbar{position:fixed;left:0;right:0;bottom:54px;z-index:28;max-width:640px;margin:0 auto;padding:8px 14px 10px;display:none;
  background:linear-gradient(180deg,rgba(250,248,244,0),var(--bg) 42%)}
.actionbar.on{display:block}.actionbar .btn{margin-top:0}
#s-clients,#s-jobs,#s-billing{padding-bottom:60px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;max-width:640px;margin:0 auto}
.nav button{flex:1;background:none;border:0;padding:9px 0 8px;font-size:10.5px;color:var(--muted);cursor:pointer;font-weight:700}
.nav button .i{display:block;font-size:19px}.nav button.on{color:var(--accent)}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(20,22,25,.5);display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 26px}
.sheet h3{font-size:18px;font-weight:800;margin-bottom:4px}.sheet .close{float:right;background:none;border:0;font-size:22px;color:var(--muted);cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:60;background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
.spin{text-align:center;padding:40px;color:var(--muted)}
.syncb{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;display:none}.syncb.on{display:inline-block}
.syncb.saving{background:rgba(255,255,255,.22);color:#fff}.syncb.ok{background:#d8efdf;color:#2c6b42}.syncb.fail{background:#f5d9d3;color:#a33;cursor:pointer}
.colorrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.colorrow input[type=color]{width:46px;height:38px;padding:2px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.swatches{display:flex;gap:6px;flex-wrap:wrap}.sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div><h1 id="bizName">Service Pro CRM</h1><div class="sub" id="screenName">Home</div></div>
    <div style="display:flex;align-items:center;gap:8px">
      <span id="syncBadge" class="syncb" onclick="syncRetry()"></span>
      <button class="iconbtn" onclick="refreshAll()" title="Refresh">⟳</button>
    </div>
  </div>

  <div class="screen on" id="s-home"><div id="homeBody"><div class="spin">Loading…</div></div></div>

  <div class="screen" id="s-clients">
    <input id="clientSearch" placeholder="Search clients…" oninput="renderClients()">
    <div id="clientsBody" style="margin-top:10px"></div>
  </div>

  <div class="screen" id="s-jobs"><div id="jobsBody"></div></div>
  <div class="screen" id="s-billing"><div id="billingBody"></div></div>

  <div class="screen" id="s-more">
    <h2 class="sec">More</h2>
    <div class="list-item" onclick="openPriceBook()"><div class="row"><div><div class="name">🧾 Price book</div><div class="meta">Default prices for your services (auto-fill estimates)</div></div><span>›</span></div></div>
    <div class="list-item" onclick="nav('settings')"><div class="row"><div><div class="name">⚙️ Business Settings</div><div class="meta">Profile, tax, payment, numbering, brand</div></div><span>›</span></div></div>
  </div>

  <div class="screen" id="s-settings"><div id="settingsBody"></div></div>
</div>

<div class="actionbar" id="actionbar"></div>
<div class="nav">
  <button class="on" data-s="home" onclick="nav('home')"><span class="i">🏠</span>Home</button>
  <button data-s="clients" onclick="nav('clients')"><span class="i">👥</span>Clients</button>
  <button data-s="jobs" onclick="nav('jobs')"><span class="i">🗓️</span>Jobs</button>
  <button data-s="billing" onclick="nav('billing')"><span class="i">💵</span>Billing</button>
  <button data-s="more" onclick="nav('more')"><span class="i">⋯</span>More</button>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<!-- Local-first boot payload: the whole dataset, inlined by doGet() so the app opens with ZERO server
     round trips. Server-rendered via HtmlService template; a raw '{}' when served statically/in preview. -->
<script type="application/json" id="__BOOT__"><?!= boot ?></script>
<script>
var BUILD='2026-07-17k-pickclient-fix';
var BOOT_T0=(window.performance&&performance.now)?0:Date.now();   // browser paint→script start baseline (perf.now is page-relative)
var BOOT_MS=null;                                                  // filled once boot() finishes hydrating
// The inlined dataset (see the #__BOOT__ data block). Parsed once; null if served statically or on a
// parse failure, in which case boot() falls back to the old apiBootstrap round trip.
var BOOT=null;
try{ var _bt=document.getElementById('__BOOT__'); if(_bt){ var _raw=(_bt.textContent||'').trim(); if(_raw && _raw!=='{}') BOOT=JSON.parse(_raw); } }catch(e){ BOOT=null; }
/* ================= perf instrumentation (Stage 0) =================
   Times every google.script.run round trip so we can SEE where the seconds go on the real device
   instead of guessing. Toggle verbose logging with ?perf=1 or localStorage crm_perf=1.
   crmPerf() prints a per-call summary; the Settings screen shows a live one-line readout. */
function _now(){ return (window.performance&&performance.now)?performance.now():Date.now(); }
var PERF={ calls:[], on:false };
try{ PERF.on=/[?&]perf=1/.test(location.search)||localStorage.getItem('crm_perf')==='1'; }catch(e){}
function perfLog(fn,ms,ok){ PERF.calls.push({fn:fn,ms:Math.round(ms),ok:ok,at:Date.now()}); if(PERF.calls.length>300)PERF.calls.shift();
  if(PERF.on&&window.console)console.log('[api]',fn,Math.round(ms)+'ms',ok?'ok':'ERR'); }
function crmPerf(){ var m={}; PERF.calls.forEach(function(c){ var a=m[c.fn]||(m[c.fn]={n:0,sum:0,max:0}); a.n++; a.sum+=c.ms; a.max=Math.max(a.max,c.ms); });
  Object.keys(m).forEach(function(k){ m[k].avg=Math.round(m[k].sum/m[k].n); }); if(window.console&&console.table)console.table(m); return m; }
function perfReadout(){ var n=PERF.calls.length, sum=0; PERF.calls.forEach(function(c){sum+=c.ms;});
  var kb=null; try{ var b=localStorage.getItem(CACHE_KEY); if(b)kb=Math.round(b.length/1024); }catch(e){}
  return (BOOT_MS!=null?('boot '+BOOT_MS+'ms · '):'')+n+' api calls'+(n?' · avg '+Math.round(sum/n)+'ms':'')+(kb!=null?' · cache '+kb+'KB':''); }
/* ================= state + api ================= */
var S = { settings:{}, services:[], servicesAll:[], enums:{}, dashboard:null, clients:null, jobs:null, billing:null, lineItems:{}, counters:{}, logo:undefined };
var CUR='$';

/* ================= local save (localStorage snapshot of the dataset) =================
   The whole point: reads no longer wait on the network for the app to become usable.
   On boot we hydrate S from this snapshot and paint immediately, THEN refresh from the
   server in the background. Best-effort only — every access is guarded so private-mode,
   quota, or a corrupt blob can never break the app; the server stays the source of truth. */
var CACHE_KEY='crm2_cache', CACHE_VER='3';   // bump CACHE_VER whenever the shape of S changes → auto-invalidates old blobs
var _cacheT=null;
function lsAvail(){ try{ var k='__crmt'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; } }
var LS_OK=lsAvail();
/** Persist the dataset. Debounced (coalesces bursts); pass true to flush synchronously (page hide). */
function saveCache(now){
  if(!LS_OK) return;
  var flush=function(){
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({
      v:CACHE_VER, at:Date.now(),
      settings:S.settings, services:S.services, servicesAll:S.servicesAll, enums:S.enums,
      dashboard:S.dashboard, clients:S.clients, jobs:S.jobs, billing:S.billing, lineItems:S.lineItems, counters:S.counters, logo:S.logo
    })); }catch(e){ /* quota / serialize failure — cache is best-effort, ignore */ }
  };
  clearTimeout(_cacheT);
  if(now) flush(); else _cacheT=setTimeout(flush, 400);
}
/** Hydrate S from the last snapshot. Returns true if a usable dataset was loaded. */
function loadCache(){
  if(!LS_OK) return false;
  try{
    var raw=localStorage.getItem(CACHE_KEY); if(!raw) return false;
    var c=JSON.parse(raw); if(!c || c.v!==CACHE_VER) return false;
    if(c.settings)    S.settings=c.settings;
    if(c.services)    S.services=c.services;
    if(c.servicesAll) S.servicesAll=c.servicesAll;
    if(c.enums)       S.enums=c.enums;
    if(c.dashboard!==undefined) S.dashboard=c.dashboard;
    if(c.clients!==undefined)   S.clients=c.clients;
    if(c.jobs!==undefined)      S.jobs=c.jobs;
    if(c.billing!==undefined)   S.billing=c.billing;
    if(c.lineItems!==undefined) S.lineItems=c.lineItems;
    if(c.counters)              S.counters=c.counters;
    if(c.logo!==undefined)      S.logo=c.logo;
    return !!(S.settings && Object.keys(S.settings).length);
  }catch(e){ return false; }
}
function clearCache(){ if(LS_OK){ try{ localStorage.removeItem(CACHE_KEY); }catch(e){} } }
function api(fn){
  var args=[].slice.call(arguments,1);
  var t0=_now();
  return new Promise(function(res,rej){
    var fin=function(ok,v){ perfLog(fn,_now()-t0,ok); (ok?res:rej)(v); };
    if(typeof google==='undefined'||!google.script||!google.script.run){ return fin(true,mock(fn,args)); }
    var r=google.script.run.withSuccessHandler(function(v){fin(true,v);}).withFailureHandler(function(e){fin(false,e);});
    r[fn].apply(r,args);
  });
}
/* ---------- optimistic sync engine (writes apply locally, upload in background) ---------- */
var SYNC={q:[],active:false,seq:0}, STORE='crm2_sync', _restoredQueue=false;
function enqueue(fn,args,label,opts){ opts=opts||{}; SYNC.q.push({id:'op'+(++SYNC.seq),fn:fn,args:args,label:label,tries:0,_onOk:opts.onOk,_onFail:opts.onFail}); persistQueue(); syncBadge(); syncPump(); }
/* Temp-ID resolution — the fix for "pick a valid client". A record created optimistically carries a
   local temp id (tmp…) until the server assigns the real one. When that real id arrives, rewrite every
   still-queued op's args so a dependent write (estimate→client, invoice→estimate) references the REAL id
   instead of the temp that the server has never heard of. Args are JSON → a scoped string swap is safe
   because temp ids ('tmp7') are unique and never collide with real ids ('CL-0002'). */
function remapPending(tempId,realId){
  if(!tempId||!realId||tempId===realId) return;
  SYNC.q.forEach(function(op){ try{ op.args=JSON.parse(JSON.stringify(op.args).split(tempId).join(realId)); }catch(e){} });
  persistQueue();
}
/* Client-side sequential IDs. Single-writer means the app can assign the next real CL/EST/INV number
   itself (seeded from the boot counters) — no round trip, no "temp" placeholder, invoice numbers stay
   sequential. The server adopts the id if it's free and only hands back a corrected one on a rare
   collision (a lead form / automation grabbed that number), which advanceCounter + remapPending absorb.
   Falls back to a tmp id (server assigns + remaps) if no counter is available. */
function padNum(n,w){ n=String(n); while(n.length<w) n='0'+n; return n; }
function nextLocalId(entity){
  var c=S.counters&&S.counters[entity];
  if(!c||!c.prefix) return 'tmp'+(++SYNC.seq);
  var id=c.prefix+'-'+padNum(c.next,c.pad||0); c.next++; return id;
}
function advanceCounter(entity,id){ var c=S.counters&&S.counters[entity]; if(!c)return; var n=parseInt(String(id).replace(/^.*?-/,''),10); if(isFinite(n)&&n+1>c.next)c.next=n+1; }
/* ---- durable write queue: survives reload/close mid-sync ----
   Only the replayable fields are stored (fn/args/label/tries); the optimistic-reconcile callbacks
   are functions and can't serialize. After a restored queue drains we do one authoritative refresh
   (reconcileAfterRestore) so any leftover optimistic temps are replaced by real server records. */
function persistQueue(){ if(!LS_OK) return;
  try{ localStorage.setItem(STORE, JSON.stringify(SYNC.q.map(function(o){ return {id:o.id,fn:o.fn,args:o.args,label:o.label,tries:o.tries,failed:!!o.failed}; }))); }catch(e){} }
function restoreQueue(){ if(!LS_OK) return;
  try{ var raw=localStorage.getItem(STORE); if(!raw) return; var arr=JSON.parse(raw);
    if(arr && arr.length){ SYNC.q=arr; _restoredQueue=true;
      arr.forEach(function(o){ o.failed=false; o.tries=0; var n=parseInt(String(o.id).replace(/\D/g,''),10)||0; if(n>SYNC.seq) SYNC.seq=n; });   // clear stuck state, avoid id collisions
    } }catch(e){} }
function syncPump(){
  if(SYNC.active)return; var op=SYNC.q[0]; if(!op){ syncBadge(); return; } if(op.failed){ syncBadge(); return; }
  SYNC.active=true; op.tries++; syncBadge();
  api.apply(null,[op.fn].concat(op.args)).then(function(r){
    SYNC.active=false;
    if(r&&r.ok===false){ return syncFail(op, r.msg||'rejected', true); }   // server said no → terminal, don't retry
    SYNC.q.shift(); persistQueue(); if(op._onOk){ try{op._onOk(r);}catch(e){} }
    if(!SYNC.q.length){ S.dashboard=null; saveCache();                                // queue drained → snapshot the settled dataset
      if(_restoredQueue){ _restoredQueue=false; reconcileAfterRestore(); } }          // replayed a restored queue → pull authoritative data
    else saveCache();
    syncBadge(); syncPump();
  }).catch(function(e){ SYNC.active=false; syncFail(op,(e&&e.message)||'no connection'); });
}
function syncFail(op,msg,terminal){
  if(!terminal && op.tries<4){ syncBadge(); setTimeout(syncPump,1200*op.tries); return; }   // transient → back off + retry
  if(op._onFail){ try{op._onFail(msg);}catch(e){} SYNC.q.shift(); persistQueue(); syncBadge(); toast('⚠ '+op.label+' undone ('+msg+')'); syncPump(); return; }  // roll back + unblock
  op.failed=true; persistQueue(); syncBadge(); toast('⚠ Couldn’t save "'+op.label+'" ('+msg+')');   // keep for manual retry
}
function syncRetry(){ var any=false; SYNC.q.forEach(function(o){ if(o.failed){o.failed=false;o.tries=0;any=true;} }); if(any){ persistQueue(); toast('Retrying…'); syncPump(); } }
function syncBadge(){ var el=document.getElementById('syncBadge'); var failed=SYNC.q.filter(function(o){return o.failed;}).length;
  if(failed){ el.className='syncb on fail'; el.textContent='⚠ Retry'; } else if(SYNC.q.length){ el.className='syncb on saving'; el.textContent='⟳ Saving'; }
  else { el.textContent='✓ Saved'; setTimeout(function(){ if(!SYNC.q.length) el.className='syncb'; },1500); } }
window.addEventListener('beforeunload', function(e){ saveCache(true); if(SYNC.q.length){ e.preventDefault(); e.returnValue=''; } });
// Mobile browsers often skip beforeunload; visibilitychange is the reliable "app is going away" signal.
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') saveCache(true); });

/* ================= helpers ================= */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function jarg(v){ return esc(JSON.stringify(v)); }
function money(n){ n=Number(n)||0; return CUR+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function money0(n){ n=Number(n)||0; return CUR+Math.round(n).toLocaleString(); }
function pill(s){ var k=String(s||'').toLowerCase().replace(/[^a-z]/g,''); return '<span class="pill p-'+k+'">'+esc(s||'')+'</span>'; }
function val(id){ var e=document.getElementById(id); return e?String(e.value).trim():''; }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('on');},2600); }
function busy(m){ toast(m||'Working…'); }
function openModal(h){ document.getElementById('sheet').innerHTML=h; document.getElementById('overlay').classList.add('on'); }
function closeModal(){ document.getElementById('overlay').classList.remove('on'); }
function midnight(d){ var x=new Date(d); x.setHours(0,0,0,0); return x; }
function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function isoOf(d){ var m=d.getMonth()+1,day=d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day; }
function fmtMD(d){ d=d?new Date(d):new Date(); return (d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear(); }
function fmtMDfromISO(iso){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||'')); return m?((+m[2])+'/'+(+m[3])+'/'+m[1]):fmtMD(); }
function svcName(id){ var s=(S.services||[]).filter(function(x){return x.id===id;})[0]; return s?s.name:''; }
function svcRate(id){ var s=(S.services||[]).filter(function(x){return x.id===id;})[0]; return s?s.rate:0; }
function invalidate(){ S.dashboard=null; S.clients=null; S.jobs=null; S.billing=null; _fresh={}; }
// A record that hasn't been assigned its real server id yet (still uploading). Synchronous server
// actions (send PDF, archive) can't run against these; queued/optimistic actions can (they remap).
function isTemp(id){ return String(id||'').indexOf('tmp')===0; }

/* ================= stale-while-revalidate reads =================
   Screens paint from cache instantly, then quietly refresh from the server. Two guardrails keep
   the optimistic write model intact:
     • never refresh while writes are pending (SYNC.q) — local state is ahead of the server;
     • if a write lands mid-fetch, discard the fetched result rather than regress the local edit.
   A short freshness window throttles refetch when tabbing quickly between screens. */
var FRESH_MS=20000, _fresh={};
function stale(key){ return !_fresh[key] || (Date.now()-_fresh[key])>FRESH_MS; }
function bgRefresh(key,fn,args,apply){
  if(SYNC.q.length) return;              // local is ahead of server → don't overwrite
  if(!stale(key)) return;                // refreshed recently
  api.apply(null,[fn].concat(args||[])).then(function(r){
    if(r==null || SYNC.q.length) return; // a write queued mid-flight → keep optimistic state
    apply(r); _fresh[key]=Date.now(); saveCache();
  }).catch(function(){});                // background refresh is best-effort; cache already painted
}
/** After a restored write queue drains, drop optimistic temps and re-read authoritative data. */
function reconcileAfterRestore(){ api('apiRefresh').then(function(b){ if(b&&b.ready){ hydrateFromSnapshot(b); applyBootChrome(); nav(CUR_SCREEN); } }).catch(function(){}); }

/* ================= theme ================= */
var ACCENT_DEFAULT='#8f5f22';
function hexRGB(h){ var m=/^#?([0-9a-f]{6})$/i.exec(String(h||'').trim()); if(!m)return null; var n=parseInt(m[1],16); return {r:(n>>16)&255,g:(n>>8)&255,b:n&255}; }
function toHex(c){ return '#'+[c.r,c.g,c.b].map(function(v){v=Math.max(0,Math.min(255,Math.round(v)));var s=v.toString(16);return s.length<2?'0'+s:s;}).join(''); }
function shade(h,a){ var c=hexRGB(h); if(!c)return h; var t=a<0?0:255,p=Math.abs(a); return toHex({r:c.r+(t-c.r)*p,g:c.g+(t-c.g)*p,b:c.b+(t-c.b)*p}); }
function hexA(h,a){ var c=hexRGB(h); return c?('rgba('+c.r+','+c.g+','+c.b+','+a+')'):'rgba(143,95,34,'+a+')'; }
function applyAccent(h){ h=hexRGB(h)?h:ACCENT_DEFAULT; var r=document.documentElement.style;
  r.setProperty('--accent',h); r.setProperty('--accent-lite',shade(h,.28)); r.setProperty('--accent-dark',shade(h,-.28)); r.setProperty('--accent-glow',hexA(h,.25)); }

/* ================= boot + nav ================= */
function boot(skipCache){
  // 1) Local-first: hydrate the ENTIRE dataset from the inlined payload — zero server round trips.
  if(!skipCache && BOOT && BOOT.ready){
    hydrateFromSnapshot(BOOT);
    if(BOOT_MS==null)BOOT_MS=Math.round(_now()-BOOT_T0);
    applyBootChrome(); renderHome();
    return;
  }
  // 2) Fallback (static serve / standalone preview / __BOOT__ parse failure / manual refresh):
  //    paint from the local cache, then do the legacy apiBootstrap round trip.
  var hadCache=!skipCache && loadCache();
  if(hadCache){ if(BOOT_MS==null)BOOT_MS=Math.round(_now()-BOOT_T0); applyBootChrome(); renderHome(); }
  api('apiBootstrap').then(function(b){
    if(!b||!b.ready){ if(!hadCache) document.getElementById('homeBody').innerHTML='<div class="empty">Run <b>⚡ CRM ▸ Set up / rebuild database</b> in the sheet first, then reload.</div>'; return; }
    S.settings=b.settings||{}; S.services=b.services||[]; S.enums=b.enums||{}; S.dashboard=b.dashboard;
    if(BOOT_MS==null)BOOT_MS=Math.round(_now()-BOOT_T0); _fresh.home=Date.now(); applyBootChrome(); renderHome(); saveCache();
  }).catch(function(e){ if(!hadCache) document.getElementById('homeBody').innerHTML='<div class="empty">Could not load: '+esc(e&&e.message||e)+'</div>'; });
}
/** Load a full server snapshot (from __BOOT__ or a manual refresh) into S and mark everything fresh. */
function hydrateFromSnapshot(b){
  S.settings=b.settings||{}; S.services=b.services||[]; S.servicesAll=b.servicesAll||b.services||[];
  S.enums=b.enums||{}; S.dashboard=b.dashboard;
  S.clients=b.clients||[]; S.jobs=b.jobs||[]; S.billing=b.billing||{estimates:[],invoices:[]};
  S.lineItems=b.lineItems||{}; S.counters=b.counters||{}; if(b.logo!==undefined)S.logo=b.logo;
  var t=b.at||Date.now(); _fresh={home:t,clients:t,jobs:t,billing:t};
  saveCache();
}

  CUR=String(S.settings['Currency symbol']||'$').trim()||'$';
  applyAccent(S.settings['Accent color']);
  if(S.settings['Business name']) document.getElementById('bizName').textContent=S.settings['Business name'];
}
var CUR_SCREEN='home';
var TITLES={home:'Home',clients:'Clients',jobs:'Jobs',billing:'Billing',more:'More',settings:'Business Settings'};
function nav(s){
  CUR_SCREEN=s;
  document.querySelectorAll('.screen').forEach(function(el){el.classList.remove('on');});
  document.getElementById('s-'+s).classList.add('on');
  document.querySelectorAll('.nav button').forEach(function(b){ b.classList.toggle('on', b.dataset.s===s); });
  document.getElementById('screenName').textContent=TITLES[s]||'';
  var ACT={clients:['+ New client','openClientForm()'],billing:['+ New estimate','startEstimate()'],jobs:['+ New job','openJobForm()']};
  var ab=document.getElementById('actionbar'), a=ACT[s]; ab.innerHTML=a?'<button class="btn" onclick="'+a[1]+'">'+a[0]+'</button>':''; ab.classList.toggle('on',!!a);
  window.scrollTo(0,0);
  if(s==='home')loadHome(); if(s==='clients')loadClients(); if(s==='jobs')loadJobs(); if(s==='billing')loadBilling(); if(s==='settings')renderSettings();
}
// ⟳ : one call that rebuilds the server JSON from Sheets (picks up hand edits / lead form / automations)
// and replaces the whole in-memory dataset. Guarded so a refresh never clobbers pending optimistic writes.
function refreshAll(){
  if(SYNC.q.length){ toast('Finishing saves…'); return; }
  busy('Refreshing…');
  api('apiRefresh').then(function(b){ if(!b||!b.ready){ toast('Couldn\'t refresh'); return; }
    hydrateFromSnapshot(b); applyBootChrome(); nav(CUR_SCREEN); toast('✓ Up to date'); })
    .catch(function(){ toast('Couldn\'t refresh'); }); }
// Re-render whatever screen is currently showing. A mutation reached from Home's week-jobs / follow-ups
// must refresh HOME (recomputing the dashboard), not the jobs/clients screen it "belongs" to.
function rerender(){
  if(CUR_SCREEN==='home'){ S.dashboard=computeDashboard(); renderHome(); }
  else if(CUR_SCREEN==='jobs'){ renderJobs(); }
  else if(CUR_SCREEN==='clients'){ renderClients(); }
  else if(CUR_SCREEN==='billing'){ renderBilling(); }
}

/* ================= HOME ================= */
// The dashboard is DERIVED from the in-memory dataset (S) — recomputed locally, never fetched. That
// keeps Home instant and always consistent with the optimistic edits the user just made.
function loadHome(){ S.dashboard=computeDashboard(); renderHome(); }
function _isoDate(s){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||'')); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function computeDashboard(){
  var clients=S.clients||[], jobs=S.jobs||[], b=S.billing||{}, ests=b.estimates||[], invs=b.invoices||[];
  var today=midnight(new Date());
  var wkStart=new Date(today); wkStart.setDate(wkStart.getDate()-wkStart.getDay());
  var wkEnd=new Date(wkStart); wkEnd.setDate(wkEnd.getDate()+7);
  var monStart=new Date(today.getFullYear(),today.getMonth(),1), weekAgo=addDays(today,-7);
  var nn=function(x){return Number(x)||0;};
  var newLeads=clients.filter(function(c){ var d=_isoDate(c.createdISO); return c.status==='Lead'&&d&&d>=weekAgo; }).length;
  var pipeline=ests.filter(function(e){return e.status==='Draft'||e.status==='Sent';}).reduce(function(s,e){return s+nn(e.total);},0);
  var unpaid=invs.filter(function(i){return i.status==='Sent'||i.status==='Overdue';}).reduce(function(s,i){return s+nn(i.total);},0);
  var revMonth=invs.filter(function(i){ var d=_isoDate(i.issueISO); return i.status==='Paid'&&d&&d>=monStart; }).reduce(function(s,i){return s+nn(i.total);},0);
  var revLife=invs.filter(function(i){return i.status==='Paid';}).reduce(function(s,i){return s+nn(i.total);},0);
  var won=clients.filter(function(c){return c.status==='Active'||c.status==='Inactive';}).length;
  var lost=clients.filter(function(c){return c.status==='Lost';}).length;
  var followUps=clients.filter(function(c){ var d=_isoDate(c.followUpISO); return (c.status==='Lead'||c.status==='Active')&&d&&d<=today; })
    .sort(function(a,b){return String(a.followUpISO).localeCompare(String(b.followUpISO));})
    .map(function(c){return {id:c.id,name:c.name,phone:c.phone,status:c.status,due:c.followUp||fmtMDfromISO(c.followUpISO)};});
  var weekJobs=jobs.filter(function(j){ var d=_isoDate(j.dateISO); return j.status==='Scheduled'&&d&&d>=wkStart&&d<wkEnd; })
    .sort(function(a,b){return String(a.dateISO).localeCompare(String(b.dateISO));})
    .map(function(j){return {id:j.id,client:j.client,date:j.date,time:j.time,service:j.service,status:j.status};});
  return { newLeads:newLeads, pipeline:pipeline, unpaid:unpaid, jobsWeek:weekJobs.length, revMonth:revMonth,
    winRate:(won+lost)?Math.round(won/(won+lost)*100):0, revLife:revLife, followUps:followUps, weekJobs:weekJobs };
}
function tile(l,v,h,g){ return '<div class="tile'+(g?' good':'')+'"><div class="l">'+l+'</div><div class="v">'+v+'</div>'+(h?'<div class="hint">'+esc(h)+'</div>':'')+'</div>'; }
function renderHome(){
  var d=S.dashboard||(S.dashboard=computeDashboard());
  var h='<div class="tiles">'+tile('New leads · 7d',d.newLeads)+tile('Unpaid',money0(d.unpaid),'billed, not paid')+
    tile('Jobs this week',d.jobsWeek)+tile('Revenue · mo',money0(d.revMonth))+'</div>'+
    '<div class="tiles" style="margin-top:10px">'+tile('Win rate',d.winRate+'%','clients won vs lost',1)+tile('Lifetime',money0(d.revLife),'',1)+'</div>';
  h+='<h2 class="sec">🔔 Follow-ups due</h2>';
  h+= (d.followUps&&d.followUps.length) ? d.followUps.map(function(f){
    return '<div class="list-item" onclick="openClient('+jarg(f.id)+')"><div class="row"><div><div class="name">'+esc(f.name)+'</div><div class="meta">'+esc(f.phone||'—')+' · due '+esc(f.due)+'</div></div>'+pill(f.status)+'</div></div>';
  }).join('') : '<div class="empty">All caught up 🎉</div>';
  h+='<h2 class="sec">📅 This week\'s jobs</h2>';
  var wj=(d.weekJobs||[]);
  h+= wj.length ? wj.map(function(j){
    return '<div class="list-item" onclick="openJob('+jarg(j.id)+')"><div class="row"><div><div class="name">'+esc(j.client)+'</div><div class="meta">'+esc(j.date)+(j.time?' · '+esc(j.time):'')+(j.service?' · '+esc(j.service):'')+'</div></div>'+pill(j.status)+'</div></div>';
  }).join('') : '<div class="empty">No active jobs this week</div>';
  document.getElementById('homeBody').innerHTML=h;
}

function loadClients(){

  document.getElementById('clientsBody').innerHTML='<div class="spin">Loading…</div>';
  api('apiListClients').then(function(l){ S.clients=l||[]; saveCache(); renderClients(); }).catch(function(e){ document.getElementById('clientsBody').innerHTML='<div class="empty">Couldn\'t load.</div>'; }); }
function renderClients(){
  var q=(document.getElementById('clientSearch').value||'').toLowerCase();
  var list=(S.clients||[]).filter(function(c){ return !q || (c.name+' '+c.phone+' '+c.email).toLowerCase().indexOf(q)>-1; })
    .sort(function(a,b){ return a.name.localeCompare(b.name); });
  var body=document.getElementById('clientsBody');
  if(!list.length){ body.innerHTML='<div class="empty">'+(q?'No matches.':'No clients yet. Tap + to add one.')+'</div>'; return; }

    var sub=esc(c.phone||'—')+(c.email?' · '+esc(c.email):'');
    return '<div class="list-item" onclick="openClient('+jarg(c.id)+')"><div class="row"><div><div class="name">'+esc(c.name)+'</div><div class="meta">'+sub+'</div></div>'+pill(c.status)+'</div></div>';

function clientById(id){ return (S.clients||[]).filter(function(c){return c.id===id;})[0]; }
function openClient(id){

    '<h2 class="sec">Follow-up</h2><div class="two"><div><input type="date" id="cf_date" value="'+esc(c.followUpISO||'')+'"></div><div><button class="btn sec" onclick="setClientFollowUp('+jarg(id)+')">Set date</button></div></div>'+
    '<h2 class="sec">Status</h2><div class="btnrow" style="flex-wrap:wrap">'+statusBtns+'</div>'+
    '<div class="btnrow"><button class="btn sec" onclick="openClientEdit('+jarg(id)+')">Edit</button><button class="btn danger" onclick="archiveClient('+jarg(id)+')">Archive</button></div>');
}

function localDupClients(email,phone){ var em=String(email||'').trim().toLowerCase(), ph=String(phone||'').replace(/[^0-9]/g,'');
  return (S.clients||[]).filter(function(c){ var ce=String(c.email||'').trim().toLowerCase(), cp=String(c.phone||'').replace(/[^0-9]/g,''); return (em&&ce===em)||(ph.length>=7&&cp===ph); }); }
function saveClient(cb){
  var name=val('nc_name'); if(!name){ toast('Name is required'); return; }
  var form={name:name,phone:val('nc_phone'),email:val('nc_email'),address:val('nc_address'),status:val('nc_status')||'Lead',source:val('nc_source')};
  var dup=localDupClients(form.email,form.phone);
  if(dup.length && !saveClient._force){ saveClient._force=true; toast('⚠ Possible duplicate: '+dup[0].name+' — tap Add again to confirm'); return; }
  saveClient._force=false;
  var id=nextLocalId('Clients'); form.id=id;   // real CL id now — no temp, no waiting on the server
  var temp={id:id,_saving:true,name:name,phone:form.phone,email:form.email,address:form.address,status:form.status,source:form.source,followUp:'',followUpISO:'',lifetime:0,nextJob:null,openEstimate:null,unpaidInvoice:null};
  S.clients=S.clients||[]; S.clients.push(temp); closeModal(); toast('✅ Client added'); if(CUR_SCREEN==='clients')renderClients(); saveCache();
  enqueue('apiCreateClient',[form],'Client '+name,{
    onOk:function(r){ temp._saving=false; if(r&&r.id&&r.id!==id){ remapPending(id,r.id); advanceCounter('Clients',r.id); temp.id=r.id; } if(r&&r.client)Object.assign(temp,r.client); if(CUR_SCREEN==='clients')renderClients(); saveCache(); if(cb)cb(temp.id); },
    onFail:function(){ if(S.clients)S.clients=S.clients.filter(function(x){return x!==temp;}); if(CUR_SCREEN==='clients')renderClients(); }});
}

function loadJobs(){
  if(S.jobs){ renderJobs(); return; }
  document.getElementById('jobsBody').innerHTML='<div class="spin">Loading…</div>';
  api('apiListJobs').then(function(l){ S.jobs=l||[]; saveCache(); renderJobs(); }).catch(function(){ document.getElementById('jobsBody').innerHTML='<div class="empty">Couldn\'t load.</div>'; }); }
function jobById(id){ return (S.jobs||[]).filter(function(j){return j.id===id;})[0]; }
function jobRow(j,pastDue){ var tags=(pastDue?'<span class="pill p-pastdue" style="margin-right:5px">Past due</span>':'')+pill(j.status);
  return '<div class="list-item" onclick="openJob('+jarg(j.id)+')"><div class="row"><div><div class="name">'+esc(j.client||'')+'</div><div class="meta">'+esc(j.date)+(j.time?' · '+esc(j.time):'')+(j.service?' · '+esc(j.service):'')+'</div></div><div style="display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end">'+tags+'</div></div></div>'; }
function renderJobs(){
  var body=document.getElementById('jobsBody'); var today=isoOf(midnight(new Date()));
  var done=function(j){ return j.status==='Done'||j.status==='Cancelled'; };
  var g={ today:{label:'Today',arr:(S.jobs||[]).filter(function(j){return !done(j)&&(!j.dateISO||j.dateISO<=today);}).sort(function(a,b){return String(a.dateISO).localeCompare(String(b.dateISO));})},
    upcoming:{label:'Upcoming',arr:(S.jobs||[]).filter(function(j){return !done(j)&&j.dateISO&&j.dateISO>today;}).sort(function(a,b){return String(a.dateISO).localeCompare(String(b.dateISO));})},
    completed:{label:'Completed',arr:(S.jobs||[]).filter(done).sort(function(a,b){return String(b.dateISO).localeCompare(String(a.dateISO));})} };
  if(!g[JOB_TAB])JOB_TAB='today';
  var tabs='<div class="seg">'+JOB_ORDER.map(function(k){ var n=g[k].arr.length; return '<button class="segbtn'+(k===JOB_TAB?' on':'')+'" onclick="setJobTab(\''+k+'\')">'+g[k].label+(n?'<span class="tc">'+n+'</span>':'')+'</button>'; }).join('')+'</div>';
  var empty={today:'Nothing scheduled for today.',upcoming:'No upcoming jobs.',completed:'No completed jobs yet.'}[JOB_TAB];
  var list=g[JOB_TAB].arr.length ? g[JOB_TAB].arr.map(function(j){ return jobRow(j, JOB_TAB==='today'&&j.dateISO&&j.dateISO<today); }).join('') : '<div class="empty">'+empty+'</div>';
  body.innerHTML=tabs+'<div style="margin-top:12px">'+list+'</div>';
}
function serviceSelect(id,sel){ return '<select id="'+id+'"><option value="">Service…</option>'+(S.services||[]).map(function(s){return '<option value="'+esc(s.id)+'"'+(s.id===sel?' selected':'')+'>'+esc(s.name)+' · '+money(s.rate)+'</option>';}).join('')+'</select>'; }
function openJobForm(clientId){
  var rec=(S.enums.recurring||['None']).map(function(r){return '<option>'+r+'</option>';}).join('');
  // Pick-client opens its own modal (single #sheet container), which REPLACES this form — so the
  // callback re-opens the job form with the chosen client pre-filled instead of poking now-dead fields.
  var clientField = clientId ? '<div class="muted">Client: <b>'+esc((clientById(clientId)||{}).name||clientId)+'</b></div><input type="hidden" id="nj_client" value="'+esc(clientId)+'">'
    : '<label>Client *</label><div class="btnrow"><button class="btn sec" onclick="pickClient(function(id){openJobForm(id);})">Pick client…</button></div><input type="hidden" id="nj_client">';
  openModal('<button class="close" onclick="closeModal()">×</button><h3>New job</h3>'+clientField+
    '<label>Service *</label>'+serviceSelect('nj_service')+
    '<div class="two"><div><label>Date</label><input type="date" id="nj_date" value="'+isoOf(midnight(new Date()))+'"></div><div><label>Time</label><input id="nj_time" placeholder="2pm"></div></div>'+
    '<label>Repeat</label><select id="nj_recurring">'+rec+'</select>'+
    '<button class="btn" onclick="saveJob()">Add job</button>');
}
function saveJob(){
  var clientId=val('nj_client'); if(!clientId){toast('Pick a client');return;}
  var serviceId=val('nj_service'); if(!serviceId){toast('Pick a service');return;}
  var form={clientId:clientId,serviceId:serviceId,date:val('nj_date'),time:val('nj_time'),recurring:val('nj_recurring')||'None'};
  var temp={id:'tmp'+(++SYNC.seq),_saving:true,clientId:clientId,client:(clientById(clientId)||{}).name||'',serviceId:serviceId,service:svcName(serviceId),date:form.date,dateISO:form.date,time:form.time,status:'Scheduled',recurring:form.recurring};
  S.jobs=S.jobs||[]; S.jobs.push(temp); S.dashboard=null; closeModal(); toast('✅ Job added'); rerender(); saveCache();
  enqueue('apiCreateJob',[form],'Job',{
    onOk:function(r){ if(r&&r.id){ var old=temp.id; temp.id=r.id; temp._saving=false; remapPending(old,r.id); if(r.job)Object.assign(temp,r.job); rerender(); saveCache(); } },
    onFail:function(){ if(S.jobs)S.jobs=S.jobs.filter(function(x){return x!==temp;}); S.dashboard=null; rerender(); }});
}
function openJob(id){
  var j=jobById(id); if(!j)return;   // temps are viewable/editable now — status & reschedule queue and remap
  var statusBtns=(S.enums.jobStatus||[]).map(function(st){ return '<button class="btn sm sec" onclick="setJobStatus('+jarg(id)+',\''+st+'\')">'+st+'</button>'; }).join(' ');
  openModal('<button class="close" onclick="closeModal()">×</button><h3>'+esc(j.client||'')+'</h3>'+
    '<div class="muted">'+esc(j.date)+(j.time?' · '+esc(j.time):'')+' · '+esc(j.service||'')+' · '+esc(j.recurring||'None')+'</div>'+
    '<h2 class="sec">Reschedule</h2><div class="two"><div><input type="date" id="jb_date" value="'+esc(j.dateISO||'')+'"></div><div><input id="jb_time" value="'+esc(j.time||'')+'" placeholder="Time"></div></div>'+
    '<button class="btn sec" onclick="rescheduleJob('+jarg(id)+')">Save new date</button>'+
    '<h2 class="sec">Status</h2><div class="btnrow" style="flex-wrap:wrap">'+statusBtns+'</div>'+
    '<button class="btn danger" onclick="archiveJob('+jarg(id)+')">Archive job</button>');
}
function setJobStatus(id,st){ var j=jobById(id); if(j)j.status=st; closeModal(); toast('✅ '+st); S.dashboard=null; rerender(); enqueue('apiUpdateJob',[id,{Status:st}],'Job '+st); }
function rescheduleJob(id){ var iso=val('jb_date'), t=val('jb_time'); var j=jobById(id); if(j){ j.dateISO=iso; j.date=iso; j.time=t; } closeModal(); toast('📅 Rescheduled'); S.dashboard=null; rerender();
  enqueue('apiUpdateJob',[id,{date:iso,time:t}],'Reschedule'); }
function archiveJob(id){ var j=jobById(id);
  openModal('<button class="close" onclick="closeModal()">×</button><h3>Archive this job?</h3>'+
    '<div class="muted" style="margin-bottom:10px">'+esc((j||{}).client||'')+' · '+esc((j||{}).date||'')+' — hidden from your lists (kept in the sheet).</div>'+
    '<button class="btn danger" onclick="confirmArchiveJob('+jarg(id)+')">Archive</button><button class="btn sec" onclick="openJob('+jarg(id)+')">Cancel</button>'); }
function confirmArchiveJob(id){ var j=jobById(id); if(!j)return;   // optimistic: remove now, queue the write, roll back on rejection
  if(S.jobs)S.jobs=S.jobs.filter(function(x){return x!==j;}); closeModal(); toast('🗑️ Archived'); S.dashboard=null; rerender();
  enqueue('apiArchiveJob',[id],'Archive job',{ onFail:function(msg){ S.jobs.push(j); S.dashboard=null; rerender(); toast('⚠ '+(msg||'Could not archive')); } }); }

/* ================= BILLING ================= */
var BILL_TAB='quotes', BILL_ORDER=['quotes','outstanding','paid','closedq'];
function setBillTab(k){ BILL_TAB=k; renderBilling(); }
function loadBilling(){
  if(S.billing){ renderBilling(); return; }
  document.getElementById('billingBody').innerHTML='<div class="spin">Loading…</div>';
  api('apiListBilling').then(function(r){ S.billing=r||{estimates:[],invoices:[]}; saveCache(); renderBilling(); }).catch(function(){ document.getElementById('billingBody').innerHTML='<div class="empty">Couldn\'t load.</div>'; }); }
// Pull the authoritative billing list from the server but keep any still-uploading (optimistic) temps on top.
function refreshBilling(){ return api('apiListBilling').then(function(fresh){ if(!fresh)return;
  var pe=((S.billing&&S.billing.estimates)||[]).filter(function(e){return e._saving;});
  var pi=((S.billing&&S.billing.invoices)||[]).filter(function(i){return i._saving;});
  fresh.estimates=(fresh.estimates||[]).concat(pe); fresh.invoices=(fresh.invoices||[]).concat(pi);
  S.billing=fresh; saveCache(); if(CUR_SCREEN==='billing')renderBilling(); }).catch(function(){}); }
function docById(kind,id){ var arr=kind==='INVOICE'?(S.billing.invoices||[]):(S.billing.estimates||[]); return arr.filter(function(d){return d.id===id;})[0]; }
/* Line items live in memory (S.lineItems, keyed "Invoice|ID" / "Estimate|ID"), so opening a document
   is instant — no per-open round trip. Fall back to the server only on a cache miss. */
function docLinesKey(kind,id){ return (kind==='INVOICE'?'Invoice':'Estimate')+'|'+id; }
function localLines(kind,id){ var a=S.lineItems&&S.lineItems[docLinesKey(kind,id)]; return a?a.slice():null; }
function setLocalLines(kind,id,items){ if(!S.lineItems)S.lineItems={}; S.lineItems[docLinesKey(kind,id)]=(items||[]).slice(); }
function reKeyLines(kind,oldId,newId){ if(!S.lineItems)return; var ok=docLinesKey(kind,oldId),nk=docLinesKey(kind,newId); if(S.lineItems[ok]){ S.lineItems[nk]=S.lineItems[ok]; delete S.lineItems[ok]; } }
function lineRowsHtml(items){ return (items&&items.length)?items.map(function(it){ return '<div class="row" style="padding:4px 0"><span>'+esc(it.description)+' ×'+it.qty+'</span><span>'+money(it.lineTotal)+'</span></div>'; }).join(''):'<div class="muted">No line items.</div>'; }
function docRow(kind,d){ return '<div class="list-item" onclick="openDoc(\''+kind+'\','+jarg(d.id)+')"><div class="row"><div><div class="name">'+esc(d.id)+' · '+esc(d.client||'')+'</div><div class="meta">'+money(d.total)+(d.issueDate?' · '+esc(d.issueDate):'')+'</div></div>'+pill(d.status)+'</div></div>'; }
function renderBilling(){
  var b=S.billing||{estimates:[],invoices:[]}; var q=b.estimates||[], iv=b.invoices||[];
  var g={ quotes:{label:'Quotes',kind:'ESTIMATE',arr:q.filter(function(d){return d.status==='Draft'||d.status==='Sent';}),empty:'No open quotes.'},
    outstanding:{label:'Outstanding',kind:'INVOICE',arr:iv.filter(function(d){return d.status!=='Paid';}),empty:'Nothing awaiting payment 🎉'},
    paid:{label:'Paid',kind:'INVOICE',arr:iv.filter(function(d){return d.status==='Paid';}),empty:'No paid invoices yet.'},
    closedq:{label:'Closed',kind:'ESTIMATE',arr:q.filter(function(d){return d.status==='Accepted'||d.status==='Declined';}),empty:'No closed quotes.'} };
  if(!g[BILL_TAB])BILL_TAB='quotes';
  var tabs='<div class="seg">'+BILL_ORDER.map(function(k){ var n=g[k].arr.length; return '<button class="segbtn'+(k===BILL_TAB?' on':'')+'" onclick="setBillTab(\''+k+'\')">'+g[k].label+(n?'<span class="tc">'+n+'</span>':'')+'</button>'; }).join('')+'</div>';
  var G=g[BILL_TAB]; var list=G.arr.length ? G.arr.map(function(d){return docRow(G.kind,d);}).join('') : '<div class="empty">'+G.empty+'</div>';
  document.getElementById('billingBody').innerHTML=tabs+'<div style="margin-top:12px">'+list+'</div>';
}
function openDoc(kind,id,_retried){
  var d=docById(kind,id);
  if(!d){ // may be on another screen — fetch once, but never loop if it's gone (archived/deleted)
    if(_retried){ toast('That document is no longer available'); return; }
    api('apiListBilling').then(function(r){ S.billing=r; openDoc(kind,id,true); }).catch(function(){ toast('Couldn\'t load that document'); });
    return; }
  var itemsId='items_'+String(id).replace(/[^A-Za-z0-9]/g,'');
  var na=jarg(id);
  // Full status control so any mis-status (incl. an accidental "Paid") is one tap to correct.
  var enums=kind==='INVOICE'?(S.enums.invStatus||[]):(S.enums.estStatus||[]);
  var statusRow='<h2 class="sec">Status</h2><div class="btnrow" style="flex-wrap:wrap">'+enums.map(function(st){
    return '<button class="btn sm '+(st===d.status?'':'sec')+'" onclick="setDocStatus(\''+kind+'\','+na+',\''+st+'\')">'+st+'</button>'; }).join(' ')+'</div>';
  var btns;
  if(kind==='ESTIMATE'){
    btns='<button class="btn" onclick="sendDoc(\'ESTIMATE\','+na+')">Send estimate</button>'+
      '<button class="btn ghost" onclick="approveEstimate('+na+')">Approve → invoice + job</button>'+statusRow+
      '<button class="btn danger" onclick="deleteDoc(\'ESTIMATE\','+na+')">Delete quote</button>';
  } else {
    btns='<button class="btn" onclick="sendDoc(\'INVOICE\','+na+')">Send invoice</button>'+statusRow+
      '<button class="btn danger" onclick="deleteDoc(\'INVOICE\','+na+')">Delete invoice</button>';
  }
  var totals='<div class="subline"><span>Subtotal</span><span>'+money(d.subtotal)+'</span></div>'+(d.tax>0?'<div class="subline"><span>Tax</span><span>'+money(d.tax)+'</span></div>':'')+'<div class="totalbar"><span>Total</span><span>'+money(d.total)+'</span></div>';
  var dateBit=d.dateB?' · '+(kind==='INVOICE'?'due ':'valid to ')+esc(d.dateB):'';
  var items=localLines(kind,id);   // from memory — no round trip
  openModal('<button class="close" onclick="closeModal()">×</button><h3>'+(kind==='INVOICE'?'Invoice':'Estimate')+' '+esc(id)+'</h3>'+
    '<div class="muted">'+esc(d.client||'')+' · '+esc(d.status)+(d.issueDate?' · '+esc(d.issueDate):'')+dateBit+'</div>'+
    '<div class="card" style="margin-top:12px"><div id="'+itemsId+'">'+(items!=null?lineRowsHtml(items):'<div class="muted">Loading items…</div>')+'</div>'+totals+'</div>'+
    '<button class="btn sec" onclick="editLines(\''+kind+'\','+na+')">Edit line items</button>'+btns);
  if(items==null){ api('apiGetDocLines',kind,id).then(function(fetched){ var el=document.getElementById(itemsId); if(!el)return;
    setLocalLines(kind,id,fetched); el.innerHTML=lineRowsHtml(fetched); }); }   // cache miss only
}
function setDocStatus(kind,id,st){ var d=docById(kind,id); if(d)d.status=st; closeModal(); toast('✅ '+st);
  if(kind==='INVOICE'){ S.dashboard=null; }   // paid status feeds the (locally recomputed) dashboard
  rerender(); enqueue('apiUpdateDoc',[kind,id,{status:st}],'Status '+st); }
function markPaid(id){ var d=docById('INVOICE',id); if(d)d.status='Paid'; closeModal(); toast('💰 Paid'); S.dashboard=null; rerender(); enqueue('apiMarkInvoicePaid',[id],'Mark paid'); }
function deleteDoc(kind,id){
  openModal('<button class="close" onclick="closeModal()">×</button><h3>Delete '+esc(id)+'?</h3><div class="muted" style="margin-bottom:10px">This archives the '+(kind==='INVOICE'?'invoice':'quote')+' and its line items.</div>'+
    '<button class="btn danger" onclick="confirmDelete(\''+kind+'\','+jarg(id)+')">Delete</button><button class="btn sec" onclick="openDoc(\''+kind+'\','+jarg(id)+')">Cancel</button>');
}
function confirmDelete(kind,id){ var arr=kind==='INVOICE'?'invoices':'estimates'; if(S.billing&&S.billing[arr])S.billing[arr]=S.billing[arr].filter(function(d){return d.id!==id;}); S.dashboard=null; delete (S.lineItems||{})[docLinesKey(kind,id)]; closeModal(); toast('🗑️ Deleted'); rerender(); enqueue('apiDeleteDoc',[kind,id],'Delete doc'); }
function sendDoc(kind,id){
  var doc=docById(kind,id); if((doc&&doc._saving)||isTemp(id)){ toast('⏳ Finishing save — try again in a moment'); return; }   // PDF needs the record on the server
  busy('Building PDF…');
  api('apiSendDoc',kind,id).then(function(r){ closeModal();
    if(r&&r.ok){ var d=docById(kind,id); if(d&&d.status==='Draft')d.status='Sent'; renderBilling(); toast(r.emailed?'📧 Sent to '+r.email:'PDF saved to Drive'); }
    else toast((r&&r.msg)||'Failed');
  }).catch(function(e){ toast('⚠ Send failed: '+(e&&e.message||e)); }); }
function approveEstimate(id){
  openModal('<button class="close" onclick="closeModal()">×</button><h3>Approve &amp; schedule</h3><div class="muted" style="margin-bottom:10px">Accepts the quote, creates a draft invoice (dated today) and schedules a job.</div>'+
    '<div class="two"><div><label>Job date</label><input type="date" id="ap_date" value="'+isoOf(midnight(new Date()))+'"></div><div><label>Time</label><input id="ap_time" placeholder="2pm"></div></div>'+
    '<button class="btn" onclick="doApprove('+jarg(id)+')">Approve → invoice + job</button>');
}
function doApprove(id){
  var iso=val('ap_date'), tm=val('ap_time'); var est=docById('ESTIMATE',id);
  if(!est){ toast('Estimate not found'); return; }
  var prev=est.status; est.status='Accepted';   // apply locally first
  var invId=nextLocalId('Invoices');   // real INV number now — shows immediately, never renumbers
  var inv={kind:'INVOICE',id:invId,_saving:true,clientId:est.clientId,client:est.client,taxRate:est.taxRate,subtotal:est.subtotal,tax:est.tax,total:est.total,status:'Draft',issueDate:fmtMD()};
  S.billing=S.billing||{estimates:[],invoices:[]}; S.billing.invoices=S.billing.invoices||[]; S.billing.invoices.push(inv);
  var estLines=localLines('ESTIMATE',id); if(estLines) setLocalLines('INVOICE',invId,estLines);   // invoice inherits the quoted lines
  var jt=null;
  if(S.jobs){ jt={id:'tmp'+(++SYNC.seq),_saving:true,clientId:est.clientId,client:est.client,serviceId:'',service:'',date:fmtMDfromISO(iso),dateISO:iso,time:tm,status:'Scheduled',recurring:'None'}; S.jobs.push(jt); }
  var c=clientById(est.clientId); if(c&&c.status==='Lead')c.status='Active';   // approval promotes the client
  S.dashboard=null;
  closeModal(); toast('✅ Approving — invoice + job scheduled'); nav('billing'); saveCache();
  enqueue('apiApproveEstimate',[id,iso,null,{invoiceId:invId,jobTime:tm}],'Approve estimate',{   // Sheets write runs in the background
    onOk:function(r){
      inv._saving=false;
      if(r&&r.invoiceId&&r.invoiceId!==invId){ reKeyLines('INVOICE',invId,r.invoiceId); remapPending(invId,r.invoiceId); advanceCounter('Invoices',r.invoiceId); inv.id=r.invoiceId; }
      if(jt&&r&&r.jobId){ var oj=jt.id; jt.id=r.jobId; remapPending(oj,r.jobId); } if(jt)jt._saving=false;
      if(CUR_SCREEN==='billing')renderBilling(); saveCache(); },
    onFail:function(){ est.status=prev; if(S.billing&&S.billing.invoices)S.billing.invoices=S.billing.invoices.filter(function(x){return x!==inv;}); if(jt&&S.jobs)S.jobs=S.jobs.filter(function(x){return x!==jt;}); if(CUR_SCREEN==='billing')renderBilling(); }});
}

/* ---- line-item builder (create estimate + edit lines) ---- */
var QLINES=[];
function startEstimate(clientId){ if(clientId){ estimateBuilder(clientId); } else { pickClient(function(id){ estimateBuilder(id); }); } }
function estimateBuilder(clientId){
  QLINES=[{serviceId:'',qty:1,rate:''}];
  openModal('<button class="close" onclick="closeModal()">×</button><h3>New estimate</h3>'+
    '<div class="muted">Client: <b>'+esc((clientById(clientId)||{}).name||clientId)+'</b></div>'+
    '<h2 class="sec">Line items</h2><div id="qlines"></div><button class="btn sec sm" style="margin-top:6px" onclick="addQLine()">+ Add line</button>'+
    qTotalsHtml()+
    '<button class="btn" onclick="saveEstimate('+jarg(clientId)+')">Create estimate</button>');
  renderQLines();
}
function qTotalsHtml(){ return '<div class="subline"><span>Subtotal</span><span id="q_sub"></span></div>'+
  '<div class="subline"><span id="q_taxlbl">Tax</span><span id="q_tax"></span></div>'+
  '<div class="totalbar"><span>Total</span><span id="q_total"></span></div>'; }
/** Effective per-unit price for a line: the typed override if present, else the service's default. */
function lineRate(l){ return (l&&l.rate!==''&&l.rate!=null)?Number(l.rate):svcRate(l&&l.serviceId); }
/** Picking a service auto-fills its default price (unless the owner has already typed an override). */
function onQLineService(i,v){ var l=QLINES[i]; l.serviceId=v; if(!l._re){ var r=svcRate(v); l.rate=r?r:''; } renderQLines(); }
function qlineToPayload(l){ var o={serviceId:l.serviceId,qty:Number(l.qty)}; if(l.rate!==''&&l.rate!=null)o.rate=Number(l.rate); return o; }
function renderQLines(){
  document.getElementById('qlines').innerHTML=QLINES.map(function(l,i){
    return '<div class="liwrap">'+
      '<select onchange="onQLineService('+i+',this.value)"><option value="">Service…</option>'+
        (S.services||[]).map(function(s){return '<option value="'+esc(s.id)+'"'+(s.id===l.serviceId?' selected':'')+'>'+esc(s.name)+(s.rate?' · '+money(s.rate):'')+'</option>';}).join('')+
      '</select>'+
      '<div class="r2">'+
        '<div class="fld"><label>Qty</label><input type="number" inputmode="decimal" min="0" step="1" placeholder="1" value="'+(l.qty!=null?esc(l.qty):'')+'" oninput="QLINES['+i+'].qty=this.value;calcQ()"></div>'+
        '<div class="fld"><label>Price ea.</label><input type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value="'+(l.rate!==''&&l.rate!=null?esc(l.rate):'')+'" oninput="QLINES['+i+'].rate=this.value;QLINES['+i+']._re=true;calcQ()"></div>'+
        '<button class="x" onclick="delQLine('+i+')">×</button>'+
      '</div>'+
    '</div>';
  }).join('');
  calcQ();
}
function addQLine(){ QLINES.push({serviceId:'',qty:1,rate:''}); renderQLines(); }
function delQLine(i){ QLINES.splice(i,1); if(!QLINES.length)QLINES.push({serviceId:'',qty:1,rate:''}); renderQLines(); }
function calcQ(){
  var sub=0; QLINES.forEach(function(l){ sub+=(Number(l.qty)||0)*lineRate(l); });
  var rate=Number(S.settings['Sales tax %'])||0, tax=Math.round(sub*rate)/100, total=sub+tax;
  var set=function(id,v){ var e=document.getElementById(id); if(e)e.textContent=money(v); };
  set('q_sub',sub); set('q_tax',tax); set('q_total',total);
  var lbl=document.getElementById('q_taxlbl'); if(lbl)lbl.textContent='Tax'+(rate?' ('+rate+'%)':'');
}
function saveEstimate(clientId){
  var lines=QLINES.filter(function(l){return l.serviceId&&Number(l.qty)>0;}).map(qlineToPayload);
  if(!lines.length){ toast('Add a line item'); return; }
  var sub=0; QLINES.forEach(function(l){ if(l.serviceId&&Number(l.qty)>0)sub+=Number(l.qty)*lineRate(l); });
  var trate=Number(S.settings['Sales tax %'])||0, tax=Math.round(sub*trate)/100, total=sub+tax;
  var id=nextLocalId('Estimates');   // real EST number now — stays fixed, so approving it never says "not found"
  var temp={kind:'ESTIMATE',id:id,_saving:true,clientId:clientId,client:(clientById(clientId)||{}).name||'',taxRate:trate,subtotal:sub,tax:tax,total:total,status:'Draft',issueDate:fmtMD()};
  S.billing=S.billing||{estimates:[],invoices:[]}; S.billing.estimates=S.billing.estimates||[]; S.billing.estimates.push(temp);
  var disp=QLINES.filter(function(l){return l.serviceId&&Number(l.qty)>0;}).map(function(l){ var rate=lineRate(l); return { serviceId:l.serviceId, description:svcName(l.serviceId), qty:Number(l.qty), rate:rate, lineTotal:Math.round(Number(l.qty)*rate*100)/100 }; });
  setLocalLines('ESTIMATE',id,disp);   // so opening the new estimate shows its lines instantly
  S.dashboard=null; closeModal(); toast('✅ Estimate created'); nav('billing'); renderBilling(); saveCache();
  enqueue('apiCreateEstimate',[{id:id,clientId:clientId,validDays:14,lines:lines}],'Estimate',{   // Sheets write runs in the background
    onOk:function(r){ temp._saving=false; if(r&&r.id&&r.id!==id){ reKeyLines('ESTIMATE',id,r.id); remapPending(id,r.id); advanceCounter('Estimates',r.id); temp.id=r.id; } if(CUR_SCREEN==='billing')renderBilling(); saveCache(); },
    onFail:function(){ if(S.billing&&S.billing.estimates)S.billing.estimates=S.billing.estimates.filter(function(x){return x!==temp;}); if(CUR_SCREEN==='billing')renderBilling(); }});
}
function editLines(kind,id){
  var open=function(items){
    QLINES=(items&&items.length)?items.map(function(it){return {serviceId:it.serviceId,qty:it.qty,rate:it.rate,_re:true};}):[{serviceId:'',qty:1,rate:''}];
    openModal('<button class="close" onclick="closeModal()">×</button><h3>Edit line items · '+esc(id)+'</h3>'+
      '<div id="qlines"></div><button class="btn sec sm" style="margin-top:6px" onclick="addQLine()">+ Add line</button>'+
      qTotalsHtml()+
      '<button class="btn" onclick="saveLines(\''+kind+'\','+jarg(id)+')">Save</button>');
    renderQLines();
  };
  var items=localLines(kind,id);
  if(items!=null){ open(items); }                                       // from memory — instant
  else { busy('Opening…'); api('apiGetDocLines',kind,id).then(open); }  // cache miss only
}
// Optimistic: apply the new lines + recomputed totals locally, then upload once in the background.
function saveLines(kind,id){
  var valid=function(l){ return l.serviceId&&Number(l.qty)>0; };
  var payload=QLINES.filter(valid).map(qlineToPayload);
  var disp=QLINES.filter(valid).map(function(l){ var rate=lineRate(l); return { serviceId:l.serviceId, description:svcName(l.serviceId), qty:Number(l.qty), rate:rate, lineTotal:Math.round(Number(l.qty)*rate*100)/100 }; });
  setLocalLines(kind,id,disp);
  var d=docById(kind,id);
  if(d){ var sub=disp.reduce(function(s,x){return s+x.lineTotal;},0); var tr=Number(d.taxRate)||0; var tax=Math.round(sub*tr)/100;
    d.subtotal=sub; d.tax=tax; d.total=Math.round((sub+tax)*100)/100; S.dashboard=null; }
  closeModal(); toast('✅ Line items saved'); renderBilling();
  enqueue('apiSetDocLines',[kind,id,payload],'Edit lines');
}

/* ================= PRICE BOOK (services) ================= */
var PB=[];
function openPriceBook(){   // from memory (S.servicesAll) — no round trip
  PB=(S.servicesAll||S.services||[]).map(function(s){ return {id:s.id,name:s.name,rate:s.rate,active:s.active!==false,_orig:s.name+'|'+s.rate}; });
  renderPriceBook(); }
function renderPriceBook(){
  var rows=PB.map(function(s,i){
    return '<div class="liwrap"><input placeholder="Service name" value="'+esc(s.name)+'" oninput="PB['+i+'].name=this.value">'+
      '<div class="r2"><div class="fld"><label>Default price</label><input type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value="'+(s.rate!=null&&s.rate!==''?esc(s.rate):'')+'" oninput="PB['+i+'].rate=this.value"></div>'+
      '<button class="x" title="Remove" onclick="delPBRow('+i+')">×</button></div></div>';
  }).join('')||'<div class="muted">No services yet — add one below.</div>';
  openModal('<button class="close" onclick="closeModal()">×</button><h3>Price book</h3>'+
    '<div class="muted" style="margin-bottom:8px">Set a default price for each service. These auto-fill when you build an estimate — you can still change the price on any estimate.</div>'+
    '<div id="pbrows">'+rows+'</div>'+
    '<button class="btn sec sm" style="margin-top:6px" onclick="addPBRow()">+ Add service</button>'+
    '<button class="btn" onclick="savePriceBook()">Save price book</button>');
}
function addPBRow(){ PB.push({id:'',name:'',rate:'',active:true}); renderPriceBook(); }
function delPBRow(i){ var s=PB[i]; PB.splice(i,1);
  if(s&&s.id){ busy('Removing…'); api('apiArchiveService',s.id).then(function(){ toast('🗑️ Removed'); S.services=(S.services||[]).filter(function(x){return x.id!==s.id;}); }); }
  renderPriceBook(); }
function savePriceBook(){
  var ops=[];
  PB.forEach(function(s){ var name=String(s.name||'').trim(); var rate=Number(s.rate)||0;
    if(s.id){ if((s.name+'|'+s.rate)!==s._orig && name) ops.push(api('apiUpdateService',s.id,{name:name,rate:rate})); }
    else if(name){ ops.push(api('apiCreateService',{name:name,rate:rate,active:true})); } });
  busy('Saving price book…'); closeModal();
  Promise.all(ops).then(function(){ return api('apiListServices',false); })
    .then(function(list){ if(list){ S.servicesAll=list; S.services=list.filter(function(s){return s.active!==false;}); } saveCache(); toast('✅ Price book saved'); })
    .catch(function(e){ toast('⚠ '+(e&&e.message||e)); });
}

/* ================= SETTINGS ================= */

function sfield(label,key,ph){ return '<label>'+label+'</label><input id="set_'+key.replace(/[^a-z]/gi,'')+'" data-k="'+esc(key)+'" value="'+esc(S.settings[key]==null?'':S.settings[key])+'" placeholder="'+esc(ph||'')+'">'; }

  var s=S.settings;
  var h='<h2 class="sec">Business profile</h2>'+sfield('Business name','Business name','Your Business LLC')+sfield('Owner email','Owner email')+sfield('Business phone','Business phone')+sfield('Business address','Business address')+
    '<h2 class="sec">Money</h2><div class="two"><div>'+sfield('Currency symbol','Currency symbol','$')+'</div><div>'+sfield('Sales tax %','Sales tax %','0')+'</div></div>'+
    sfield('Invoice payment instructions','Invoice payment instructions')+sfield('Payment link','Payment link','paypal.me/you')+sfield('Invoice due (days)','Invoice due (days)','14')+
    '<h2 class="sec">Numbering</h2><div class="two"><div>'+sfield('Next estimate #','Estimate starting number','1001')+'</div><div>'+sfield('Next invoice #','Invoice starting number','9001')+'</div></div>'+
    '<h2 class="sec">Follow-up &amp; reviews</h2><div class="two"><div>'+sfield('Follow-up (days)','Default follow-up (days)','2')+'</div><div>'+sfield('Google review link','Google review link')+'</div></div>'+
    '<h2 class="sec">Scheduling</h2><div class="muted" style="margin-bottom:6px">Add each scheduled job to your own Google Calendar (client address becomes the event location).</div>'+
    '<div class="two"><div><label>Google Calendar sync</label><select data-k="Sync jobs to Google Calendar">'+
      ['yes','no'].map(function(v){return '<option value="'+v+'"'+(String(s['Sync jobs to Google Calendar']==null?'yes':s['Sync jobs to Google Calendar']).toLowerCase()===v?' selected':'')+'>'+(v==='yes'?'On':'Off')+'</option>';}).join('')+
      '</select></div><div>'+sfield('Default job length (hours)','Default job duration (hours)','1')+'</div></div>'+
    '<h2 class="sec">Appearance</h2><div class="muted" style="margin-bottom:6px">Accent color.</div>'+
    '<div class="colorrow"><input type="color" id="set_accent" value="'+esc(hexRGB(s['Accent color'])?s['Accent color']:ACCENT_DEFAULT)+'" oninput="applyAccent(this.value)">'+
    '<span class="swatches">'+SWATCHES.map(function(c){return '<button class="sw" style="background:'+c+'" onclick="pickAccent(\''+c+'\')"></button>';}).join('')+'</span></div>'+
    '<h2 class="sec">Company logo</h2><div class="muted" style="margin-bottom:8px">Shown on PDF estimates &amp; invoices.</div><div id="logoPreview">'+logoPreviewHtml()+'</div>'+
    '<label class="btn sec" style="cursor:pointer">Choose logo…<input type="file" id="set_logoFile" accept="image/png,image/jpeg" style="display:none" onchange="onLogoPick(this)"></label>'+
    '<button class="btn" onclick="saveSettings()">Save settings</button>'+
    '<div class="muted" style="text-align:center;margin-top:18px;opacity:.7">Build '+esc(BUILD)+'</div>'+
    '<div class="muted" style="text-align:center;margin-top:4px;opacity:.7;font-size:11px" onclick="crmPerf()">⏱ '+esc(perfReadout())+'</div>';
  document.getElementById('settingsBody').innerHTML=h;
  if(S.logo===undefined) fetchLogo();
}
function pickAccent(c){ var i=document.getElementById('set_accent'); if(i)i.value=c; applyAccent(c); }
function saveSettings(){
  var obj={}; document.querySelectorAll('#settingsBody input[data-k],#settingsBody select[data-k]').forEach(function(el){ obj[el.dataset.k]=el.value.trim(); });
  obj['Accent color']=document.getElementById('set_accent').value;
  busy('Saving…');
  api('apiSaveSettings',obj).then(function(){ Object.assign(S.settings,obj); CUR=String(obj['Currency symbol']||'$').trim()||'$'; applyAccent(obj['Accent color']); document.getElementById('bizName').textContent=obj['Business name']||'Service Pro CRM'; saveCache(); toast('✅ Settings saved'); });
}
function logoPreviewHtml(){ if(S.logo===undefined)return '<div class="muted">Loading…</div>'; if(S.logo)return '<img src="'+S.logo+'" style="max-height:70px;max-width:220px;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;display:block;margin-bottom:8px"><button class="btn sec" onclick="removeLogo()">Remove logo</button>'; return '<div class="muted" style="margin-bottom:6px">No logo yet.</div>'; }
function paintLogo(){ var el=document.getElementById('logoPreview'); if(el)el.innerHTML=logoPreviewHtml(); }
function fetchLogo(){ api('apiGetLogo').then(function(r){ S.logo=(r&&r.logo)||''; saveCache(); paintLogo(); }); }
function onLogoPick(input){ var f=input.files&&input.files[0]; if(!f)return; var img=new Image();
  img.onload=function(){ var max=360,w=img.width,h=img.height,sc=Math.min(1,max/Math.max(w,h)); var cw=Math.round(w*sc),ch=Math.round(h*sc); var cv=document.createElement('canvas'); cv.width=cw;cv.height=ch; cv.getContext('2d').drawImage(img,0,0,cw,ch); var url=cv.toDataURL('image/png'); if(url.length>48000)url=cv.toDataURL('image/jpeg',.82); if(url.length>48000){toast('Image too large');return;} S.logo=url; paintLogo(); busy('Saving logo…'); api('apiSaveLogo',url).then(function(){toast('✅ Logo saved');}); };
  img.onerror=function(){toast('Could not read image');}; var rd=new FileReader(); rd.onload=function(e){img.src=e.target.result;}; rd.readAsDataURL(f); }
function removeLogo(){ S.logo=''; paintLogo(); busy('Removing…'); api('apiSaveLogo','').then(function(){toast('Logo removed');}); }

  if(fn==='apiListBilling')return {estimates:[{kind:'ESTIMATE',id:'EST-1001',clientId:'CL-0001',client:'Ada Buyer',subtotal:390,tax:31.2,total:421.2,status:'Draft',issueDate:'7/16'}],invoices:[]};

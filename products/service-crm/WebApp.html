<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root{
    --accent:#8f5f22; --accent-lite:#b8823a; --accent-dark:#6e4a1a; --accent-glow:rgba(143,95,34,.25); --dark:#1a1c1f; --ink:#1a1c1f; --soft:#f3f0ea;
    --line:#e4dccd; --muted:#6b6459; --good:#3f7d55; --warn:#c0492b; --bg:#faf8f4; --card:#fff;
    --blue:#2a4d80; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Segoe UI',Roboto,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
  .app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:76px}
  /* top bar */
  .topbar{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;
    padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
  .topbar h1{font-size:17px;font-weight:800;letter-spacing:-.2px}
  .topbar .sub{font-size:11.5px;opacity:.85}
  .iconbtn{background:rgba(255,255,255,.18);border:0;color:#fff;width:36px;height:36px;border-radius:10px;font-size:16px;cursor:pointer}
  /* screens */
  .screen{display:none;padding:14px}
  .screen.on{display:block;animation:fade .2s ease}
  @keyframes fade{from{opacity:.3}to{opacity:1}}
  h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;margin:18px 4px 10px}
  /* metric tiles */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .tile .l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .tile .v{font-size:26px;font-weight:800;color:var(--ink);margin-top:4px;letter-spacing:-.5px}
  .tile.good .v{color:var(--good)}
  .tile .hint{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.2}
  /* cards & lists */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .list-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
  .list-item:active{border-color:var(--accent-lite)}
  .list-item .name{font-weight:700}
  .list-item .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
  .pill{font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .p-new{background:#e8eef7;color:#2a4d80}.p-contacted{background:#fff3d6;color:#8a6d1a}.p-quoted{background:#ffe4c4;color:#8f5f22}
  .p-won,.p-accepted,.p-paid,.p-done{background:#d8efdf;color:#2c6b42}.p-lost,.p-declined,.p-overdue,.p-cancelled{background:#f5d9d3;color:#a33}
  .p-draft{background:#eeeeee;color:#555}.p-sent{background:#fff3d6;color:#8a6d1a}.p-scheduled{background:#e8eef7;color:#2a4d80}.p-inprogress{background:#fff3d6;color:#8a6d1a}
  .muted{color:var(--muted);font-size:13px}
  .empty{color:var(--muted);text-align:center;padding:26px 10px;font-style:italic}
  .warn{background:#fff3d6;border:1px solid #e6cf9a;color:#8a6d1a;border-radius:12px;padding:11px 13px;margin-bottom:10px;font-size:12.5px;line-height:1.35}
  /* buttons */
  .btn{display:block;width:100%;border:0;border-radius:999px;padding:13px;font-weight:800;font-size:15px;cursor:pointer;
    background:linear-gradient(180deg,var(--accent),var(--accent-dark));color:#fff;margin-top:10px;text-align:center;text-decoration:none}
  .btn:active{filter:brightness(1.1)}
  .btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);}
  .btn.danger{background:#fff;color:var(--warn);border:1px solid #e6c3ba}
  .btn.sm{width:auto;display:inline-block;padding:9px 16px;font-size:13px;margin:0}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .btnrow .btn{flex:1;margin-top:0}
  /* forms */
  label{display:block;font-weight:700;font-size:12.5px;margin:12px 0 4px;color:var(--ink)}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .two{display:flex;gap:8px}.two>div{flex:1}
  /* fixed action button, sits just above the bottom nav */
  .actionbar{position:fixed;left:0;right:0;bottom:54px;z-index:28;max-width:640px;margin:0 auto;
    padding:8px 14px 10px;display:none;background:linear-gradient(180deg,rgba(250,248,244,0),var(--bg) 42%)}
  .actionbar.on{display:block}
  .actionbar .btn{margin-top:0}
  /* extra bottom clearance on screens that show the fixed action button */
  #s-contacts,#s-billing,#s-jobs{padding-bottom:60px}
  /* bottom nav */
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);
    display:flex;max-width:640px;margin:0 auto}
  .nav button{flex:1;background:none;border:0;padding:9px 0 8px;font-size:10.5px;color:var(--muted);cursor:pointer;font-weight:700}
  .nav button .i{display:block;font-size:19px;margin-bottom:1px}
  .nav button.on{color:var(--accent)}
  /* line item builder */
  .lirow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
  .lirow select{flex:2}.lirow input{flex:1;min-width:0}
  .lirow .x{flex:0 0 auto;width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--warn);font-size:16px;cursor:pointer}
  .totalbar{display:flex;justify-content:space-between;font-weight:800;font-size:17px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
  .totalbar .tax{font-weight:600;font-size:13px;color:var(--muted)}
  /* modal */
  .overlay{position:fixed;inset:0;z-index:40;background:rgba(20,22,25,.5);display:none;align-items:flex-end;justify-content:center}
  .overlay.on{display:flex}
  .sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 26px}
  .sheet h3{font-size:18px;font-weight:800;margin-bottom:4px}
  .sheet .close{float:right;background:none;border:0;font-size:22px;color:var(--muted);cursor:pointer}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:60;background:var(--dark);color:#fff;
    padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
  .toast.on{opacity:1}
  .spin{text-align:center;padding:40px;color:var(--muted)}
  /* segmented sort control + tabs */
  .seg{display:flex;gap:6px;margin-top:8px}
  .segbtn{flex:1;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 4px;font-weight:700;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
  .segbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .segbtn .tc{display:inline-block;margin-left:4px;font-size:10.5px;font-weight:800;opacity:.8;vertical-align:top}
  /* appearance: color picker + swatches */
  .colorrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .colorrow input[type=color]{width:46px;height:38px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
  .swatches{display:flex;gap:6px;flex-wrap:wrap}
  .sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
  /* sync badge (top bar) */
  .syncb{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap;display:none}
  .syncb.on{display:inline-block}
  .syncb.saving{background:rgba(255,255,255,.22);color:#fff}
  .syncb.ok{background:#d8efdf;color:#2c6b42}
  .syncb.fail{background:#f5d9d3;color:#a33;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div><h1 id="bizName">Service Pro CRM</h1><div class="sub" id="screenName">Home</div></div>
    <div style="display:flex;align-items:center;gap:8px">
      <span id="syncBadge" class="syncb" onclick="syncRetry()"></span>
      <button class="iconbtn" onclick="refreshAll()" title="Refresh">⟳</button>
    </div>
  </div>

  <!-- HOME -->
  <div class="screen on" id="s-home">
    <div id="homeBody"><div class="spin">Loading…</div></div>
  </div>

  <!-- CONTACTS (leads + clients) -->
  <div class="screen" id="s-contacts">
    <input id="contactSearch" placeholder="Search contacts…" oninput="renderContacts()">
    <div class="seg">
      <button class="segbtn on" data-sort="name" onclick="setContactSort('name')">Name</button>
      <button class="segbtn" data-sort="job" onclick="setContactSort('job')">Last job</button>
    </div>
    <div id="contactsBody" style="margin-top:10px"></div>
  </div>

  <!-- BILLING (quotes + invoices in one place) -->
  <div class="screen" id="s-billing">
    <div id="billingBody"></div>
  </div>

  <!-- MORE -->
  <div class="screen" id="s-more">
    <h2 class="sec">More</h2>
    <div class="list-item" onclick="nav('settings')"><div class="row"><div><div class="name">⚙️ Settings</div><div class="meta">Business info, services, tax, links</div></div><span>›</span></div></div>
  </div>

  <!-- JOBS -->
  <div class="screen" id="s-jobs">
    <div id="jobsBody"></div>
  </div>

  <!-- SETTINGS -->
  <div class="screen" id="s-settings">
    <div id="settingsBody"></div>
  </div>
</div>

<div class="actionbar" id="actionbar"></div>

<div class="nav">
  <button class="on" data-s="home" onclick="nav('home')"><span class="i">🏠</span>Home</button>
  <button data-s="contacts" onclick="nav('contacts')"><span class="i">👥</span>Contacts</button>
  <button data-s="jobs" onclick="nav('jobs')"><span class="i">🗓️</span>Jobs</button>
  <button data-s="billing" onclick="nav('billing')"><span class="i">💵</span>Billing</button>
  <button data-s="more" onclick="nav('more')"><span class="i">⋯</span>More</button>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- state + api ---------------- */
// List caches start null = "not loaded yet". Once fetched they hold an array (even if
// empty), so revisiting a tab renders instantly with no server round-trip. A mutation
// calls invalidate() to null them so the next visit refetches. (See loadX + invalidate.)
var S={settings:{},services:[],dashboard:null,contacts:null,jobs:null,quotes:null,invoices:null,statuses:{}};
var CUR='$';
// Bump this whenever you paste new code, so you can confirm a deploy actually took effect:
// it shows at the bottom of More ▸ Settings. If it doesn't match after deploying, the old
// version is still being served (Deploy ▸ Manage deployments ▸ ✏️ ▸ Version: New version).
var BUILD='2026-07-16i';
function api(fn){
  var args=[].slice.call(arguments,1);
  return new Promise(function(res,rej){
    if(typeof google==='undefined'||!google.script||!google.script.run){ return res(mock(fn,args)); }
    var r=google.script.run.withSuccessHandler(res).withFailureHandler(function(e){rej(e);});
    r[fn].apply(r,args);
  });
}

/* ================= OPTIMISTIC SYNC ENGINE =================
 * The UI updates local state instantly, then queues the server write and uploads it in the
 * background (sequential FIFO, so create-then-edit stays ordered). Edits are idempotent and
 * persisted to localStorage so they survive a reload; creates are in-session only (replaying
 * a create could duplicate a financial doc) and guarded by an unload warning. A visible badge
 * plus loud toasts report success and failure. Single-team, no-conflict → safe (see the plan). */
var SYNC={q:[],active:false,seq:0};
var STORE_KEY='crm_sync_v1';
function syncLoad(){ try{ var raw=localStorage.getItem(STORE_KEY); var arr=raw?JSON.parse(raw):[]; SYNC.q=arr.map(function(o){o.persist=true;return o;}); }catch(e){ SYNC.q=[]; } }
function syncPersist(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(SYNC.q.filter(function(o){return o.persist;}).map(function(o){return {id:o.id,fn:o.fn,args:o.args,label:o.label,tries:o.tries||0};}))); }catch(e){} }
function syncBadge(){
  var el=document.getElementById('syncBadge'); if(!el) return;
  var failed=SYNC.q.filter(function(o){return o.failed;}).length;
  var pending=SYNC.q.length;
  el.className='syncb on '+(failed?'fail':(pending?'saving':'ok'));
  if(failed){ el.textContent='⚠ '+failed+' unsynced — retry'; }
  else if(pending){ el.textContent='⟳ Saving '+pending+'…'; }
  else { el.textContent='✓ Saved'; setTimeout(function(){ if(!SYNC.q.length){ el.className='syncb'; } }, 1800); }
}
/** Apply the change locally (caller already did), then queue the server write.
 *  opts: {persist:bool (default true), onOk:fn(result), resolve:fn(op) to rewrite args at run time}. */
function enqueue(fn,args,label,opts){
  opts=opts||{};
  var op={id:'op'+(++SYNC.seq),fn:fn,args:args,label:label,tries:0,persist:opts.persist!==false,_onOk:opts.onOk,_resolve:opts.resolve};
  SYNC.q.push(op); syncPersist(); syncBadge(); syncPump();
}
function syncPump(){
  if(SYNC.active) return;
  var op=SYNC.q[0]; if(!op){ syncBadge(); return; }
  if(op.failed) { syncBadge(); return; }   // wait for manual retry
  SYNC.active=true; op.tries=(op.tries||0)+1; syncBadge();
  var args=op._resolve?op._resolve(op):op.args;
  api.apply(null,[op.fn].concat(args)).then(function(r){
    SYNC.active=false;
    if(r&&r.ok===false){ return syncFail(op, r.msg||'rejected by server'); }  // server said no
    SYNC.q.shift(); syncPersist();
    if(op._onOk){ try{ op._onOk(r); }catch(e){} }
    if(!SYNC.q.length){ S.dashboard=null; }   // aggregates recompute fresh next Home visit
    syncBadge();
    if(!SYNC.q.length) toast('✓ All changes saved');
    syncPump();
  }).catch(function(e){ SYNC.active=false; syncFail(op,(e&&e.message)||'no connection'); });
}
function syncFail(op,msg){
  if(op.tries<4){ syncBadge(); setTimeout(syncPump, 1200*op.tries); return; }   // auto-retry w/ backoff
  op.failed=true; syncPersist(); syncBadge();
  toast('⚠ Couldn’t save "'+op.label+'" ('+msg+'). Tap the ⚠ badge to retry.');
}
function syncRetry(){
  var any=false; SYNC.q.forEach(function(o){ if(o.failed){ o.failed=false; o.tries=0; any=true; } });
  if(any){ toast('Retrying…'); syncPersist(); syncPump(); }
}
function money(n){ n=Number(n)||0; return CUR+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function money0(n){ n=Number(n)||0; return CUR+Math.round(n).toLocaleString(); }
function fmtLocal(iso){ var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||''); return m?(+m[2])+'/'+(+m[3])+'/'+m[1]:''; }   // yyyy-mm-dd → M/D/YYYY
function findDoc(kind,number){ var list=kind==='INVOICE'?S.invoices:S.quotes; return (list||[]).filter(function(x){return String(x.number)===String(number);})[0]; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
// A JS value safe to drop into a double-quoted on* HTML attribute. JSON.stringify on a STRING
// arg (e.g. a formatted doc number like "1099") yields embedded double-quotes that would close
// the attribute early and break the handler; esc() turns them into &quot; so the parser keeps
// the whole call. (Freshly-created docs return string numbers; sheet reads return numeric ones.)
function jarg(v){ return esc(JSON.stringify(v)); }
function pill(status){ var k=String(status||'').toLowerCase().replace(/[^a-z]/g,''); return '<span class="pill p-'+k+'">'+esc(status||'')+'</span>'; }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('on');},2600); }
function busy(msg){ toast(msg||'Working…'); }

/* ---------------- nav ---------------- */
var CUR_SCREEN='home';
var TITLES={home:'Home',contacts:'Contacts',billing:'Billing',more:'More',jobs:'Jobs',settings:'Settings'};
function nav(s){
  if(s==='quotes'||s==='invoices') s='billing';      // old names → merged Billing screen
  if(s==='leads'||s==='clients') s='contacts';       // old names → merged Contacts screen
  CUR_SCREEN=s;
  document.querySelectorAll('.screen').forEach(function(el){el.classList.remove('on');});
  document.getElementById('s-'+s).classList.add('on');
  document.querySelectorAll('.nav button').forEach(function(b){ b.classList.toggle('on', b.dataset.s===s); });
  document.getElementById('screenName').textContent=TITLES[s]||'';
  var ACT={contacts:['+ New contact','openContactForm()'],billing:['+ New estimate','openQuoteBuilder()'],jobs:['+ New job','openJobForm()']};
  var ab=document.getElementById('actionbar'), a=ACT[s];
  ab.innerHTML=a?'<button class="btn" onclick="'+a[1]+'">'+a[0]+'</button>':'';
  ab.classList.toggle('on',!!a);
  window.scrollTo(0,0);
  if(s==='home')loadHome();
  if(s==='contacts')loadContacts();
  if(s==='billing')loadBilling();
  if(s==='jobs')loadJobs();
  if(s==='settings')renderSettings();
}

/* ---------------- modal ---------------- */
function openModal(html){ document.getElementById('sheet').innerHTML=html; document.getElementById('overlay').classList.add('on'); }
function closeModal(){ document.getElementById('overlay').classList.remove('on'); }

/* ---------------- boot ---------------- */
/* ---------------- theme (accent color) ---------------- */
var ACCENT_DEFAULT='#8f5f22';
function clamp255(n){ return Math.max(0,Math.min(255,Math.round(n))); }
function hexRGB(hex){ var m=/^#?([0-9a-f]{6})$/i.exec(String(hex||'').trim()); if(!m)return null;
  var n=parseInt(m[1],16); return {r:(n>>16)&255,g:(n>>8)&255,b:n&255}; }
function toHex(c){ return '#'+[c.r,c.g,c.b].map(function(v){var s=clamp255(v).toString(16);return s.length<2?'0'+s:s;}).join(''); }
function shade(hex,amt){ var c=hexRGB(hex); if(!c)return hex;   // amt<0 darkens toward black, >0 lightens toward white
  var t=amt<0?0:255, p=Math.abs(amt); return toHex({r:c.r+(t-c.r)*p,g:c.g+(t-c.g)*p,b:c.b+(t-c.b)*p}); }
function hexA(hex,a){ var c=hexRGB(hex); return c?('rgba('+c.r+','+c.g+','+c.b+','+a+')'):'rgba(143,95,34,'+a+')'; }
function applyAccent(hex){
  hex=(hexRGB(hex)?hex:ACCENT_DEFAULT);
  var r=document.documentElement.style;
  r.setProperty('--accent',hex);
  r.setProperty('--accent-lite',shade(hex,0.28));
  r.setProperty('--accent-dark',shade(hex,-0.28));
  r.setProperty('--accent-glow',hexA(hex,0.25));
}
function boot(){
  api('apiBootstrap').then(function(b){
    if(!b||!b.ready){ document.getElementById('homeBody').innerHTML='<div class="empty">Run <b>⚡ CRM ▸ Set up / rebuild CRM</b> in the sheet first, then reload.</div>'; return; }
    S.settings=b.settings||{}; S.services=b.services||[]; S.dashboard=b.dashboard;
    S.statuses={lead:b.leadStatuses,job:b.jobStatuses,inv:b.invStatuses,est:b.estStatuses,repeat:b.repeatOpts};
    CUR=(S.settings.currency||'$').trim()||'$';
    applyAccent(S.settings.accent);
    if(S.settings.businessName) document.getElementById('bizName').textContent=S.settings.businessName;
    renderHome();
  }).catch(function(e){ document.getElementById('homeBody').innerHTML='<div class="empty">Could not load: '+esc(e&&e.message||e)+'</div>'; });
}
// Drop all cached lists so the next view refetches. Call after any change that writes
// to the sheet (add/edit/delete/status/approve/pay/reschedule).
function invalidate(){ S.dashboard=null; S.contacts=null; S.jobs=null; S.quotes=null; S.invoices=null; }
function refreshAll(){ busy('Refreshing…'); invalidate(); boot(); nav(CUR_SCREEN); }

/* ---------------- HOME ---------------- */
function loadHome(){ if(!S.dashboard){ api('apiDashboard').then(function(d){S.dashboard=d;renderHome();}); } else renderHome(); }
function renderHome(){
  var d=S.dashboard; if(!d){ return; }
  var h='';
  h+='<div class="tiles">'+
     tile('New leads · 7d',d.newLeads)+tile('Unpaid',money0(d.unpaid||0),'invoices sent, not paid')+
     tile('Jobs this week',d.jobsWeek)+tile('Revenue · mo',money0(d.revMonth))+'</div>';
  h+='<div class="tiles" style="margin-top:10px">'+tileGood('Win rate',d.winRate+'%','of leads marked Won vs Lost')+tileGood('Lifetime',money0(d.revLife))+'</div>';
  h+='<div class="btnrow"><button class="btn" onclick="openContactForm()">+ Contact</button><button class="btn" onclick="openQuoteBuilder()">+ Estimate</button></div>';
  h+='<h2 class="sec">🔔 Follow-ups due</h2>';
  if(d.followUps&&d.followUps.length){ d.followUps.forEach(function(f){
    h+='<div class="list-item"><div class="row"><div><div class="name">'+esc(f.name)+'</div><div class="meta">'+esc(f.phone||'—')+' · due '+esc(f.due)+'</div></div>'+pill(f.status)+'</div></div>';
  }); } else h+='<div class="empty">All caught up 🎉</div>';
  h+='<h2 class="sec">📅 This week\'s jobs</h2>';
  // Server already returns active jobs this week, soonest first. Filter again defensively so a
  // stale deployment can't surface completed/cancelled jobs here.
  var wj=(d.weekJobs||[]).filter(function(j){ return j.status!=='Done'&&j.status!=='Cancelled'; });

/* ---- date helpers (follow-up + job reschedule) ---- */
function midnight(d){ var x=new Date(d); x.setHours(0,0,0,0); return x; }
function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function nextMonday(t){ var diff=(8-t.getDay())%7; if(diff===0)diff=7; return addDays(t,diff); }
function isoOf(d){ var m=d.getMonth()+1,day=d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day; }
// "7/22/2026" or "7/22" → "2026-07-22" (for local Today/Upcoming classification). '' if unparseable.
function parseDateISO(s){ var m=/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/.exec(String(s||'').trim()); if(!m)return '';
  var mo=+m[1],da=+m[2],yr=m[3]?+m[3]:(new Date()).getFullYear(); if(yr<100)yr+=2000;
  return yr+'-'+(mo<10?'0':'')+mo+'-'+(da<10?'0':'')+da; }
function normPhone(s){ var d=String(s||'').replace(/[^0-9]/g,''); return d.length>=7?d:''; }
// Duplicate check against the already-loaded contacts — no server round-trip needed.
function localDupes(email,phone){
  var em=String(email||'').trim().toLowerCase(), ph=normPhone(phone);
  if(!em&&!ph)return [];
  return (S.contacts||[]).filter(function(c){ if(c._saving)return false;
    var ce=String(c.email||'').trim().toLowerCase(), cp=normPhone(c.phone);
    return (em&&ce&&ce===em)||(ph&&cp&&cp===ph);
  }).map(function(c){ return {name:c.name,where:c.clientRow?'client':'lead',phone:c.phone,email:c.email}; });
}
function reindexContacts(){ (S.contacts||[]).forEach(function(c,i){c._i=i;}); }
// Tag rule: once someone has a logged job, show their last job date (green). Otherwise
// show their lead status (New / Quoted / Declined / Lost).
function contactTag(c){
  if(c.lastJobISO) return {label:'Job '+esc(c.lastJobDate),cls:'p-paid'};
  var s=c.leadStatus||'';
  if(s==='Contacted') s='New';
  if(s==='Won') return {label:'Client',cls:'p-paid'};
  if(!s) return c.clientRow?{label:'Client',cls:'p-paid'}:{label:'New',cls:'p-new'};
  return {label:esc(s),cls:'p-'+s.toLowerCase().replace(/[^a-z]/g,'')};
}

function submitLead(force){

  if(!S.contacts){

    });

  enqueue('apiAddLead',[Object.assign({},p,{force:true})],'Contact '+p.name,{persist:false,onOk:function(r){

function createQuote(send){
  var client=val('q_client'); if(!client){toast('Client name required');return;}
  var lines=QLINES.filter(function(l){return l.service&&Number(l.rate)>0;});
  if(!lines.length){toast('Add a line item with a price');return;}
  var sub=0; lines.forEach(function(l){ sub+=(Number(l.qty)||1)*(Number(l.rate)||0); });
  var tax=Number(S.settings.taxPct)||0; var total=sub+sub*tax/100;
  var payload={client:client,email:val('q_email'),phone:val('q_phone'),validDays:14,lines:lines};
  var tempId='t'+(++SYNC.seq);
  // Optimistic: show a placeholder estimate immediately; the real number arrives on sync.
  var temp={_tempId:tempId,_saving:true,row:0,number:'',client:client,dateA:fmtLocal(isoOf(midnight(new Date()))),amount:total,status:'Draft',
    _lines:lines.map(function(l){return {service:l.service,qty:Number(l.qty)||1,rate:Number(l.rate)||0};})};   // cache lines so opening is instant
  closeModal(); toast(send?'✅ Estimate saved — sending…':'✅ Estimate saved');
  // Add the placeholder and queue the create together (so the temp exists before it can sync).
  var go=function(){
    S.quotes.unshift(temp); nav('billing');
    enqueue('apiCreateEstimate',[payload],'Estimate for '+client,{persist:false,onOk:function(res){
      if(!res||!res.ok) return;
      var d=(S.quotes||[]).filter(function(x){return x._tempId===tempId;})[0];
      if(d){ d.number=res.number; d._saving=false; d._tempId=null; }
      if(CUR_SCREEN==='billing')renderBilling();
      if(send && res.number) sendDoc('ESTIMATE',res.number);   // send once we have the real number
    }});
  };
  if(S.quotes&&S.invoices){ go(); }
  else { api('apiListBilling').then(function(r){ S.quotes=(r&&r.estimates)||[]; S.invoices=(r&&r.invoices)||[]; go(); }); }
}

function editLines(kind,number){

function renderJobs(){
  var body=document.getElementById('jobsBody');
  if(!S.jobs.length){
    // Self-heal: if the Jobs list came back empty but the dashboard already sees jobs this
    // week, the two reads disagree — almost always an older deployment still serving stale
    // code. Don't show a misleading "No jobs yet"; show the jobs we DO have (from the
    // dashboard) and tell the owner exactly how to fix it.
    var wk=(S.dashboard&&S.dashboard.weekJobs)||[];
    if(wk.length){
      var w='<div class="warn">⚠ Showing this week’s jobs from your dashboard — the full Jobs list didn’t load. This usually means the app is running older code. Fix it once: <b>Deploy ▸ Manage deployments ▸ ✏️ ▸ Version: New version ▸ Deploy</b>, then tap ⟳.</div>';
      wk.forEach(function(j){
        w+='<div class="list-item" onclick="openJobFromHome('+j.row+')"><div class="row"><div><div class="name">'+esc(j.client)+'</div>'+
           '<div class="meta">'+esc(j.date)+(j.service?' · '+esc(j.service):'')+'</div></div>'+pill(j.status)+'</div></div>';
      });
      body.innerHTML=w; return;
    }
  }
  var today=isoOf(midnight(new Date()));
  var done=function(j){return ['Done','Cancelled'].indexOf(j.status)>=0;};
  var groups={
    today:     {label:'Today',     arr:S.jobs.filter(function(j){return !done(j)&&(!j.dateISO||j.dateISO<=today);}).sort(function(a,b){return String(a.dateISO||'').localeCompare(String(b.dateISO||''));})},
    upcoming:  {label:'Upcoming',  arr:S.jobs.filter(function(j){return !done(j)&&j.dateISO&&j.dateISO>today;}).sort(function(a,b){return String(a.dateISO).localeCompare(String(b.dateISO));})},
    completed: {label:'Completed', arr:S.jobs.filter(done).sort(function(a,b){return String(b.dateISO||'').localeCompare(String(a.dateISO||''));})}
  };
  if(!groups[JOB_TAB]) JOB_TAB='today';
  var tabs='<div class="seg">'+JOB_ORDER.map(function(k){
    var g=groups[k], n=g.arr.length;
    return '<button class="segbtn'+(k===JOB_TAB?' on':'')+'" onclick="setJobTab(\''+k+'\')">'+g.label+(n?'<span class="tc">'+n+'</span>':'')+'</button>';
  }).join('')+'</div>';
  var g=groups[JOB_TAB];
  var empty={today:'Nothing scheduled for today.',upcoming:'No upcoming jobs.',completed:'No completed jobs yet.'}[JOB_TAB];
  var list=g.arr.length ? g.arr.map(function(j){ return jobRow(j, JOB_TAB==='today' && j.dateISO && j.dateISO<today); }).join('')
                        : '<div class="empty">'+empty+'</div>';
  body.innerHTML=tabs+'<div style="margin-top:12px">'+list+'</div>';
}

// Downscale the picked image on a canvas so the stored data URL stays small (sheet cell limit).
function onLogoPick(input){
  var f=input.files&&input.files[0]; if(!f)return;
  var img=new Image();
  img.onload=function(){
    var max=360, w=img.width, h=img.height, sc=Math.min(1,max/Math.max(w,h));
    var cw=Math.max(1,Math.round(w*sc)), ch=Math.max(1,Math.round(h*sc));
    var cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
    cv.getContext('2d').drawImage(img,0,0,cw,ch);
    var url=cv.toDataURL('image/png');
    if(url.length>48000){ url=cv.toDataURL('image/jpeg',0.82); }   // fall back to JPEG if PNG too big
    if(url.length>48000){ toast('That image is too large — try a smaller/simpler logo'); return; }
    S.logo=url; paintLogoPreview();
    busy('Saving logo…'); api('apiSaveLogo',url).then(function(){ toast('✅ Logo saved'); });
  };
  img.onerror=function(){ toast('Could not read that image'); };
  var rd=new FileReader(); rd.onload=function(e){ img.src=e.target.result; }; rd.readAsDataURL(f);
}

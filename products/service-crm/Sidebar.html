<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  :root{--accent:#8f5f22;--dark:#6e4a1a;--ink:#1a1c1f;--soft:#f3f0ea;--line:#e4dccd;--muted:#52565c}
  *{box-sizing:border-box}
  body{font-family:'Segoe UI',Roboto,Arial,sans-serif;margin:0;padding:14px;color:var(--ink);font-size:13px}
  .hero{background:linear-gradient(135deg,var(--accent),var(--dark));color:#fff;border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .hero h1{margin:0;font-size:16px}.hero p{margin:4px 0 0;font-size:11.5px;opacity:.9}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  .card h2{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  label{display:block;font-weight:600;margin:8px 0 3px;font-size:12px}
  input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(143,95,34,.3)}
  button{width:100%;border:0;border-radius:999px;padding:11px;font-weight:700;font-size:13px;cursor:pointer;color:#fff;background:linear-gradient(180deg,var(--accent),var(--dark));margin-top:12px}
  button.sec{background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:8px}
  button:disabled{opacity:.55}
  .toast{font-size:12px;padding:9px 11px;border-radius:8px;margin-top:10px;display:none}
  .toast.ok{background:#d8efdf;color:#2c6b42;display:block}.toast.err{background:#f5d9d3;color:#a33;display:block}.toast.working{background:#eef1f7;color:#33415a;display:block}
  .fu{border-bottom:1px solid #f0ece3;padding:8px 0;display:flex;justify-content:space-between;align-items:center}.fu:last-child{border-bottom:0}
  .fu b{font-size:12.5px}.fu .meta{color:var(--muted);font-size:11px}
  .pill{font-size:10px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--accent)}
  .empty{color:var(--muted);font-style:italic;padding:6px 0}
</style>
</head>
<body>
  <div class="hero"><h1>⚡ Quick Actions</h1><p>Capture a lead and see who's due for a follow-up.</p></div>

  <div class="card">
    <h2>➕ New lead</h2>
    <label>Name *</label><input id="c_name" placeholder="Jane Smith">
    <label>Phone</label><input id="c_phone" placeholder="(555) 123-4567">
    <label>Email</label><input id="c_email" placeholder="jane@email.com">
    <button id="addBtn" onclick="addLead()">Add lead</button>
    <div id="addToast" class="toast"></div>
  </div>

  <div class="card">
    <h2>🔔 Follow-ups due</h2>
    <div id="fuList"><div class="empty">Loading…</div></div>
  </div>

  <button class="sec" onclick="google.script.run.showWebAppLink()">📲 Open the full app</button>

<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function setToast(el,cls,msg){el.className='toast '+cls;el.textContent=msg;}
function load(){
  google.script.run.withSuccessHandler(function(d){
    var el=document.getElementById('fuList'); var fu=(d&&d.followUps)||[];
    el.innerHTML = fu.length ? fu.map(function(f){
      return '<div class="fu"><div><b>'+esc(f.name)+'</b><div class="meta">'+esc(f.phone||'—')+' · due '+esc(f.due)+'</div></div><span class="pill">'+esc(f.status)+'</span></div>';
    }).join('') : '<div class="empty">All caught up 🎉</div>';
  }).withFailureHandler(function(e){ document.getElementById('fuList').innerHTML='<div class="empty">Couldn\'t load.</div>'; }).sidebarData();
}
function addLead(){
  var name=document.getElementById('c_name').value.trim();
  var t=document.getElementById('addToast'), b=document.getElementById('addBtn');
  if(!name){ setToast(t,'err','Name is required.'); return; }
  b.disabled=true; setToast(t,'working','Adding…');
  google.script.run.withSuccessHandler(function(r){
    b.disabled=false;
    if(r&&r.ok){ setToast(t,'ok','✅ Added "'+name+'" as a lead.'); ['c_name','c_phone','c_email'].forEach(function(id){document.getElementById(id).value='';}); load(); }
    else setToast(t,'err',(r&&r.msg)||'Failed.');
  }).withFailureHandler(function(e){ b.disabled=false; setToast(t,'err',String(e&&e.message||e)); })
   .sidebarAddClient({ name:name, phone:document.getElementById('c_phone').value.trim(), email:document.getElementById('c_email').value.trim(), status:'Lead', source:'Sidebar' });
}
load();
</script>
</body>
</html>
